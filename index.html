<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Haung Ting Ming - Influencer Portfolio Management</title>

    <!-- Google Fonts & Tailwind CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '"Prompt"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#1e1b4b',
                        }
                    }
                }
            }
        }
    </script>

    <!-- React 18 & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase 11 SDK Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Dynamic or fallback Firebase configuration
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config)
            : {
                apiKey: "AIzaSyCEqqlQ5v7muBfcrePVjc6e0wcS7Ihr3YI",
                authDomain: "agency-b8e1d.firebaseapp.com",
                projectId: "agency-b8e1d",
                storageBucket: "agency-b8e1d.firebasestorage.app",
                messagingSenderId: "1085196717304",
                appId: "1:1085196717304:web:91c88184bd5ae64b9fbf0d",
                measurementId: "G-0J928RY0HN"
            };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Expose Firebase API globally for React component
        window.FirebaseAPI = {
            auth,
            db,
            signInAnonymously,
            signInWithCustomToken,
            onAuthStateChanged,
            doc,
            getDoc,
            setDoc,
            updateDoc,
            deleteDoc,
            onSnapshot,
            collection
        };
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
        body { font-family: 'Plus Jakarta Sans', 'Prompt', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(229, 231, 235, 0.8);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Mobile Smooth Interactions */
        @media (max-width: 640px) {
            .mobile-modal-full {
                height: 100%;
                max-height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        // Utility to fix & convert common cloud image links (Google Drive, Dropbox) into direct image URLs
        const formatImageUrl = (url) => {
            if (!url) return '';
            let cleaned = url.trim();

            // Convert Google Drive view links to direct image content URLs
            if (cleaned.includes('drive.google.com')) {
                const match = cleaned.match(/\/d\/([a-zA-Z0-9_-]+)/) || cleaned.match(/id=([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    return `https://lh3.googleusercontent.com/d/${match[1]}`;
                }
            }

            // Convert Dropbox share links to raw direct image links
            if (cleaned.includes('dropbox.com')) {
                return cleaned.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '');
            }

            return cleaned;
        };

        const { useState, useEffect, useRef } = React;

        // Firebase Fallback logic
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'Haung Ting Ming-talent-agency';
        
        const INITIAL_INFLUENCERS = [];

        function App() {
            // States
            const [influencers, setInfluencers] = useState([]);
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [searchTerm, setSearchTerm] = useState('');
            const [activeInfluencer, setActiveInfluencer] = useState(null);
            
            // Image Lightbox Preview State
            const [viewImage, setViewImage] = useState(null);

            // Admin States
            const [isAdmin, setIsAdmin] = useState(false);
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [adminLoginError, setAdminLoginError] = useState('');
            const [showAddEditModal, setShowAddEditModal] = useState(false);
            const [editingInfluencer, setEditingInfluencer] = useState(null);

            // Secret Logo Double-Click Hint counter
            const [logoClickCount, setLogoClickCount] = useState(0);

            // Firebase & Sync States
            const [fbReady, setFbReady] = useState(!!window.FirebaseAPI);
            const [currentUser, setCurrentUser] = useState(null);
            const [fbStatus, setFbStatus] = useState({ connected: false, error: null });

            // Chat States
            const [showChatModal, setShowChatModal] = useState(false);
            const [visitorId] = useState(() => {
                let id = localStorage.getItem('Haung Ting Ming_visitor_id');
                if (!id) {
                    id = 'user_' + Math.random().toString(36).substring(2, 9);
                    localStorage.setItem('Haung Ting Ming_visitor_id', id);
                }
                return id;
            });
            const [allChats, setAllChats] = useState([]);
            const [newMessageText, setNewMessageText] = useState('');
            const [selectedAdminThread, setSelectedAdminThread] = useState(null);
            const chatEndRef = useRef(null);

            // Notification / Alert Toast
            const [toast, setToast] = useState(null);

            const showToast = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3000);
            };

            // Listen for Firebase ready event
            useEffect(() => {
                if (window.FirebaseAPI) {
                    setFbReady(true);
                    return;
                }
                const handleReady = () => setFbReady(true);
                window.addEventListener('firebase-ready', handleReady);
                return () => window.removeEventListener('firebase-ready', handleReady);
            }, []);

            // Authenticate with Firebase Auth
            useEffect(() => {
                if (!fbReady) return;
                const { auth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = window.FirebaseAPI;
                
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else if (!auth.currentUser) {
                            await signInAnonymously(auth);
                        }
                        setFbStatus({ connected: true, error: null });
                    } catch (err) {
                        console.error('Firebase Auth Error:', err);
                        setFbStatus({ 
                            connected: false, 
                            error: err.code === 'auth/operation-not-allowed' 
                                ? 'ยังไม่ได้เปิดใช้งาน Anonymous Auth ใน Firebase Console' 
                                : err.message 
                        });
                    }
                };

                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (user) => {
                    setCurrentUser(user);
                    if (user) {
                        setFbStatus({ connected: true, error: null });
                    }
                });

                return () => unsubscribe();
            }, [fbReady]);

            // Sync Influencers & Chats from Firestore
            useEffect(() => {
                if (!fbReady) {
                    const savedInf = localStorage.getItem('Haung Ting Ming_influencers');
                    if (savedInf) setInfluencers(JSON.parse(savedInf));
                    else setInfluencers(INITIAL_INFLUENCERS);

                    const savedChats = localStorage.getItem('Haung Ting Ming_chat_messages');
                    if (savedChats) setAllChats(JSON.parse(savedChats));
                    return;
                }

                const { db, collection, onSnapshot, setDoc, doc } = window.FirebaseAPI;
                const activeAppId = typeof __app_id !== 'undefined' ? __app_id : 'agency-b8e1d';

                // 1. Subscribe to Influencers
                const infColRef = collection(db, 'artifacts', activeAppId, 'public', 'data', 'influencers');
                const unsubscribeInf = onSnapshot(infColRef, (snapshot) => {
                    setFbStatus(prev => ({ ...prev, connected: true }));
                    if (snapshot.empty) {
                        INITIAL_INFLUENCERS.forEach(async (inf) => {
                            try {
                                await setDoc(doc(db, 'artifacts', activeAppId, 'public', 'data', 'influencers', inf.id), inf);
                            } catch (e) {
                                console.error('Error seeding influencer:', e);
                            }
                        });
                    } else {
                        const list = snapshot.docs.map(d => d.data());
                        setInfluencers(list);
                        localStorage.setItem('Haung Ting Ming_influencers', JSON.stringify(list));
                    }
                }, (error) => {
                    console.error('Firestore Influencers snapshot error:', error);
                    setFbStatus(prev => ({ 
                        ...prev, 
                        error: prev.error || 'ไม่สามารถดึงข้อมูลจาก Firestore: ' + error.message 
                    }));
                    const savedInf = localStorage.getItem('Haung Ting Ming_influencers');
                    if (savedInf) setInfluencers(JSON.parse(savedInf));
                    else setInfluencers(INITIAL_INFLUENCERS);
                });

                // 2. Subscribe to Chats (with robust deduplication by ID)
                const chatsColRef = collection(db, 'artifacts', activeAppId, 'public', 'data', 'chats');
                const unsubscribeChats = onSnapshot(chatsColRef, (snapshot) => {
                    if (snapshot.empty) {
                        const welcomeMsg = {
                            id: 'msg-1',
                            visitorId: visitorId,
                            sender: 'admin',
                            text: 'สวัสดีครับ! ยินดีต้อนรับสู่ Haung Ting Ming หากต้องการสอบถามคิวงาน หรือขอเรทการ์ดเพิ่มเติม ทักแชทไว้ได้เลยครับ',
                            timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                            createdAt: Date.now()
                        };
                        setDoc(doc(db, 'artifacts', activeAppId, 'public', 'data', 'chats', welcomeMsg.id), welcomeMsg);
                    } else {
                        const rawList = snapshot.docs.map(d => d.data());
                        
                        // Deduplicate messages by ID to prevent text overlay / duplicate bubble bugs
                        const uniqueMap = new Map();
                        rawList.forEach(item => {
                            if (item.id) uniqueMap.set(item.id, item);
                        });
                        const list = Array.from(uniqueMap.values());
                        list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                        
                        setAllChats(list);
                        localStorage.setItem('Haung Ting Ming_chat_messages', JSON.stringify(list));
                    }
                }, (error) => {
                    console.error('Firestore Chats snapshot error:', error);
                    const savedChats = localStorage.getItem('Haung Ting Ming_chat_messages');
                    if (savedChats) setAllChats(JSON.parse(savedChats));
                });

                return () => {
                    unsubscribeInf();
                    unsubscribeChats();
                };
            }, [fbReady]);

            // Save Chats & Influencers to localStorage backup
            useEffect(() => {
                if (influencers.length > 0) {
                    localStorage.setItem('Haung Ting Ming_influencers', JSON.stringify(influencers));
                }
            }, [influencers]);

            useEffect(() => {
                if (allChats.length > 0) {
                    localStorage.setItem('Haung Ting Ming_chat_messages', JSON.stringify(allChats));
                }
            }, [allChats]);

            // Auto scroll chat
            useEffect(() => {
                if (chatEndRef.current) {
                    chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [allChats, showChatModal, selectedAdminThread]);

            const handleLogoDoubleClick = () => {
                if (!isAdmin) {
                    setAdminLoginError('');
                    setAdminPassword('');
                    setShowAdminLogin(true);
                    showToast('เปิดหน้าเข้าสู่ระบบ Admin', 'info');
                }
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                setAdminLoginError('');
                
                if (adminPassword === 'Pack' || adminPassword === 'Pack') {
                    setIsAdmin(true);
                    setShowAdminLogin(false);
                    setAdminPassword('');
                    setAdminLoginError('');
                    showToast('เข้าสู่ระบบสำหรับ Admin เรียบร้อยแล้ว');
                } else {
                    setAdminLoginError('รหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง');
                }
            };

            const handleLogout = () => {
                setIsAdmin(false);
                showToast('ออกจากระบบ Admin เรียบร้อย');
            };

            const categories = ['All', 'Beauty & Lifestyle', 'Tech & Gadget', 'Food & Travel', 'Fashion', 'Gaming'];

            const filteredInfluencers = influencers.filter(inf => {
                const matchesCat = selectedCategory === 'All' || inf.category === selectedCategory;
                const matchesSearch = inf.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                      inf.handle.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                      inf.bio.toLowerCase().includes(searchTerm.toLowerCase());
                return matchesCat && matchesSearch;
            });

            const handleSaveInfluencer = async (formData) => {
                const targetId = formData.id || ('inf-' + Date.now());
                
                // Format all Image URLs automatically
                const updatedData = { 
                    ...formData, 
                    id: targetId,
                    avatar: formatImageUrl(formData.avatar),
                    gallery: (formData.gallery || []).map(g => ({ ...g, url: formatImageUrl(g.url) }))
                };

                if (fbReady) {
                    const { db, doc, setDoc } = window.FirebaseAPI;
                    const activeAppId = typeof __app_id !== 'undefined' ? __app_id : 'agency-b8e1d';
                    try {
                        await setDoc(doc(db, 'artifacts', activeAppId, 'public', 'data', 'influencers', targetId), updatedData);
                    } catch (e) {
                        console.error('Error saving to Firestore:', e);
                    }
                }

                setInfluencers(prev => {
                    const exists = prev.some(i => i.id === targetId);
                    if (exists) return prev.map(i => i.id === targetId ? updatedData : i);
                    return [updatedData, ...prev];
                });

                showToast(formData.id ? 'อัปเดตข้อมูล Influencer สำเร็จ' : 'เพิ่ม Influencer ใหม่เรียบร้อย');
                setShowAddEditModal(false);
                setEditingInfluencer(null);
            };

            const handleDeleteInfluencer = async (id) => {
                if (window.confirm('คุณแน่ใจหรือไม่ว่าต้องการลบ Influencer รายนี้?')) {
                    if (fbReady) {
                        const { db, doc, deleteDoc } = window.FirebaseAPI;
                        const activeAppId = typeof __app_id !== 'undefined' ? __app_id : 'agency-b8e1d';
                        try {
                            await deleteDoc(doc(db, 'artifacts', activeAppId, 'public', 'data', 'influencers', id));
                        } catch (e) {
                            console.error('Error deleting from Firestore:', e);
                        }
                    }
                    setInfluencers(prev => prev.filter(item => item.id !== id));
                    setActiveInfluencer(null);
                    showToast('ลบข้อมูลเรียบร้อยแล้ว');
                }
            };

            const handleSendMessage = async (targetVisitorId = visitorId) => {
                if (!newMessageText.trim()) return;

                const messageId = 'msg-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6);
                const newMsg = {
                    id: messageId,
                    visitorId: isAdmin ? targetVisitorId : visitorId,
                    sender: isAdmin ? 'admin' : 'user',
                    text: newMessageText.trim(),
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    createdAt: Date.now()
                };

                setNewMessageText('');

                if (fbReady) {
                    const { db, doc, setDoc } = window.FirebaseAPI;
                    const activeAppId = typeof __app_id !== 'undefined' ? __app_id : 'agency-b8e1d';
                    try {
                        await setDoc(doc(db, 'artifacts', activeAppId, 'public', 'data', 'chats', newMsg.id), newMsg);
                        // Firestore snapshot listener will update `allChats` cleanly
                        return;
                    } catch (e) {
                        console.error('Error sending message to Firestore:', e);
                    }
                }

                // Fallback local update with deduplication check
                setAllChats(prev => {
                    if (prev.some(m => m.id === newMsg.id)) return prev;
                    return [...prev, newMsg];
                });
            };

            // Get chat threads for Admin
            const chatThreads = Array.from(new Set(allChats.map(m => m.visitorId))).map(vId => {
                const userMsgs = allChats.filter(m => m.visitorId === vId);
                const lastMsg = userMsgs[userMsgs.length - 1];
                return {
                    visitorId: vId,
                    lastMessage: lastMsg ? lastMsg.text : '',
                    timestamp: lastMsg ? lastMsg.timestamp : '',
                    unread: userMsgs.some(m => m.sender === 'user')
                };
            });

            // Deduplicate chat list before rendering
            const currentChats = Array.from(
                new Map(
                    allChats
                        .filter(m => isAdmin ? (selectedAdminThread ? m.visitorId === selectedAdminThread : true) : m.visitorId === visitorId)
                        .map(m => [m.id, m])
                ).values()
            );

            return (
                <div className="min-h-screen flex flex-col relative pb-12">
                    {/* Toast Notification */}
                    {toast && (
                        <div className={`fixed top-4 left-4 right-4 sm:left-auto sm:right-5 z-50 px-4 py-3 rounded-xl shadow-xl text-white font-medium text-xs sm:text-sm flex items-center justify-between sm:justify-start gap-2 transition-all duration-300 ${toast.type === 'error' ? 'bg-rose-500' : 'bg-indigo-600'}`}>
                            <div className="flex items-center gap-2">
                                <i className={toast.type === 'error' ? 'fa-solid fa-circle-exclamation' : 'fa-solid fa-circle-check'}></i>
                                <span>{toast.msg}</span>
                            </div>
                        </div>
                    )}

                    {/* Navigation Header */}
                    <header className="sticky top-0 z-30 glass-panel border-b border-slate-200/80">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 sm:py-4 flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-0">
                            {/* Logo with Secret Double Click to Open Admin Login */}
                            <div 
                                className="flex items-center gap-2.5 cursor-pointer select-none group w-full sm:w-auto justify-between sm:justify-start" 
                                onDoubleClick={handleLogoDoubleClick}
                                onClick={() => setSelectedCategory('All')}
                                title="ดับเบิ้ลคลิกเพื่อเปิด Admin Login"
                            >
                                <div className="flex items-center gap-2.5">
                                    <div className="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-200 group-hover:scale-105 transition-transform flex-shrink-0">
                                        <i className="fa-solid fa-sparkles text-sm sm:text-base"></i>
                                    </div>
                                    <div>
                                        <span className="text-base sm:text-lg font-bold tracking-tight text-slate-900 block leading-none">
                                            Haung Ting Ming <span className="text-indigo-600">TALENT</span>
                                        </span>
                                        <span className="text-[10px] sm:text-xs text-slate-500 tracking-wider">INFLUENCER AGENCY</span>
                                    </div>
                                </div>

                                {/* Mobile Quick Chat Button */}
                                <button 
                                    onClick={() => setShowChatModal(true)}
                                    className="sm:hidden px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-medium flex items-center gap-1.5 shadow-sm"
                                >
                                    <i className="fa-regular fa-comment-dots text-indigo-400"></i>
                                    <span>{isAdmin ? 'แชท' : 'ติดต่อ'}</span>
                                </button>
                            </div>

                            {/* Actions & Status */}
                            <div className="flex items-center gap-2.5 w-full sm:w-auto justify-end">
                                {/* Firebase Status Indicator - VISIBLE ONLY IN ADMIN MODE */}
                                {isAdmin && (
                                    <span 
                                        className={`px-2.5 py-1 rounded-full text-[10px] sm:text-[11px] font-semibold flex items-center gap-1.5 border ${
                                            fbStatus.connected 
                                                ? 'bg-emerald-50 text-emerald-700 border-emerald-200' 
                                                : 'bg-amber-50 text-amber-700 border-amber-200'
                                        }`}
                                    >
                                        <span className={`w-2 h-2 rounded-full ${fbStatus.connected ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`}></span>
                                        {fbStatus.connected ? 'Firebase Online' : 'Offline / Local'}
                                    </span>
                                )}

                                {isAdmin && (
                                    <div className="flex items-center gap-2">
                                        <span className="px-2.5 py-1 bg-amber-100 text-amber-800 text-[10px] sm:text-xs font-semibold rounded-full border border-amber-200 flex items-center gap-1">
                                            <span className="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
                                            Admin
                                        </span>
                                        <button 
                                            onClick={() => { setEditingInfluencer(null); setShowAddEditModal(true); }}
                                            className="px-3 py-1.5 sm:px-4 sm:py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs sm:text-sm font-medium shadow-sm transition-all flex items-center gap-1.5"
                                        >
                                            <i className="fa-solid fa-plus text-xs"></i>
                                            <span>เพิ่ม Influencer</span>
                                        </button>
                                        <button 
                                            onClick={handleLogout}
                                            className="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100"
                                            title="ออกจากระบบ"
                                        >
                                            <i className="fa-solid fa-arrow-right-from-bracket text-base"></i>
                                        </button>
                                    </div>
                                )}

                                {/* Desktop Floating Chat Button */}
                                <button 
                                    onClick={() => setShowChatModal(true)}
                                    className="hidden sm:flex relative px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-sm font-medium shadow-sm transition-all items-center gap-2"
                                >
                                    <i className="fa-regular fa-comment-dots text-indigo-400"></i>
                                    <span>{isAdmin ? 'ศูนย์รับแชท' : 'ติดต่อ Admin'}</span>
                                    {isAdmin && chatThreads.length > 0 && (
                                        <span className="absolute -top-1 -right-1 w-5 h-5 bg-rose-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-white">
                                            {chatThreads.length}
                                        </span>
                                    )}
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10 flex-1 w-full">
                        {/* Firebase Warning Banner if Auth or Firestore has errors (Admin Only) */}
                        {isAdmin && fbStatus.error && (

                                                        placeholder="ลิงก์ URL รูปภาพ (https://...)"
                                                        value={item.url}
                                                        onChange={e => handleGalleryChange(index, 'url', e.target.value)}
                                                        className="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg bg-white"
                                                    />
                                                </div>
                                                <button 
                                                    type="button" 
                                                    onClick={() => handleRemoveGalleryImage(index)}
                                                    className="text-rose-500 p-1 hover:text-rose-700 mt-1"
                                                    title="ลบรูปภาพนี้"
                                                >
                                                    <i className="fa-solid fa-trash"></i>
                                                </button>
                                            </div>
                                        ))
                                    ) : (
                                        <p className="text-[11px] text-slate-400 italic">ยังไม่มีรูปภาพเรทการ์ด กดปุ่ม "+ เพิ่มรูปภาพเรทการ์ด" ด้านบนเพื่อเพิ่ม</p>
                                    )}
                                </div>
                            </div>

                            {/* Works Video Clips Embed */}
                            <div>
                                <div className="flex items-center justify-between mb-2">
                                    <span className="font-bold text-slate-700">คลิปผลงานตัวอย่าง (YouTube / Embed)</span>
                                    <button 
                                        type="button" 
                                        onClick={handleAddWork}
                                        className="text-indigo-600 font-semibold hover:underline"
                                    >
                                        + แปะลิงก์คลิป
                                    </button>
                                </div>
                                <div className="space-y-2">
                                    {formData.works.map((work, index) => (
                                        <div key={work.id || index} className="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200">
                                            <input 
                                                placeholder="หัวข้อคลิป"
                                                value={work.title}
                                                onChange={e => handleWorkChange(index, 'title', e.target.value)}
                                                className="w-1/3 px-2.5 py-1.5 border border-slate-200 rounded-lg bg-white"
                                            />
                                            <input 
                                                placeholder="Embed URL (https://www.youtube.com/embed/...)"
                                                value={work.url}
                                                onChange={e => handleWorkChange(index, 'url', e.target.value)}
                                                className="flex-1 px-2.5 py-1.5 border border-slate-200 rounded-lg bg-white"
                                            />
                                            <button 
                                                type="button" 
                                                onClick={() => handleRemoveWork(index)}
                                                className="text-rose-500 p-1 hover:text-rose-700"
                                            >
                                                <i className="fa-solid fa-trash"></i>
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="pt-4 border-t border-slate-200 flex justify-end gap-2 flex-shrink-0">
                                <button 
                                    type="button" 
                                    onClick={onClose}
                                    className="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl font-semibold"
                                >
                                    ยกเลิก
                                </button>
                                <button 
                                    type="submit" 
                                    className="px-5 py-2 bg-indigo-600 text-white rounded-xl font-semibold shadow-sm"
                                >
                                    บันทึกข้อมูล
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
