        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCEqqlQ5v7muBfcrePVjc6e0wcS7Ihr3YI",
            authDomain: "agency-b8e1d.firebaseapp.com",
            projectId: "agency-b8e1d",
            storageBucket: "agency-b8e1d.firebasestorage.app",
            messagingSenderId: "1085196717304",
            appId: "1:1085196717304:web:91c88184bd5ae64b9fbf0d",
            measurementId: "G-0J928RY0HN"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Expose Firebase API globally for React component
        window.FirebaseAPI = {
            auth,
            db,
            signInAnonymously,
            signInWithCustomToken,
            onAuthStateChanged,
            doc,
            getDoc,
            setDoc,
            updateDoc,
            deleteDoc,
            onSnapshot,
            collection
        };
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

        const { useState, useEffect, useRef } = React;

        // Firebase Fallback logic

        // Initial Seed Mock Data
        const INITIAL_INFLUENCERS = [

                    { id: 'w2', title: 'แต่งตัว OOTD คาเฟ่มินิมอล', type: 'video', url: 'https://assets.mixkit.co/videos/preview/mixkit-fashion-model-in-a-pink-outfit-41238-large.mp4' }

            },
            {

                contactEmail: 'work.maxtech@gmail.com',

                scopes: [
                    { id: 's1', name: 'YouTube Full Dedicated Review', price: 65000, note: 'ความยาว 10-15 นาที เจาะลึกฟีเจอร์เด่น' },
                    { id: 's2', name: 'Short Video (TikTok / Shorts / Reels)', price: 25000, note: 'เน้นสรุปข้อดี-ข้อเสียใน 1 นาที' }
                ],
                gallery: [
                    { id: 'g1', title: 'Tech Review Rate Card Card Set', url: 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&q=80&w=800' }
                ],
                works: [
                    { id: 'w1', title: 'แกะกล่องสมาร์ทโฟนเรือธงรุ่นใหม่ล่าสุด', type: 'youtube', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' }
                ]
            },
            {
                id: 'inf-3',
                name: 'ออมสิน กินเที่ยว (Aomsin Cafe)',
                handle: '@aomsin_travel',
                category: 'Food & Travel',
                avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&q=80&w=600',
                followers: { tiktok: '2.1M', instagram: '680K' },
                bio: 'พาเช็คอินคาเฟ่ฮิต ร้านอาหารเด็ด สายกินสายเดินทาง ห้ามพลาด!',
                contactEmail: 'aomsin.booking@gmail.com',
                contactPhone: '082-111-2233',
                scopes: [
                    { id: 's1', name: 'พาเที่ยว/รีวิวร้านอาหาร (TikTok)', price: 28000, note: 'ลงพื้นที่ถ่ายทำจริง ครอบคลุมค่าเดินทางใน BKK' },
                    { id: 's2', name: 'IG Photo Set (4-6 รูป) + Story', price: 20000, note: 'คุมโทนภาพมินิมอลสวยงาม' }
                ],
                gallery: [],
                works: []
            }
        ];

        function App() {
            // States
            const [influencers, setInfluencers] = useState([]);
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [searchTerm, setSearchTerm] = useState('');
            const [activeInfluencer, setActiveInfluencer] = useState(null);
            
            // Image Lightbox Preview State
            const [viewImage, setViewImage] = useState(null);

            // Admin States
            const [isAdmin, setIsAdmin] = useState(false);
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [showAddEditModal, setShowAddEditModal] = useState(false);
            const [editingInfluencer, setEditingInfluencer] = useState(null);

            // Firebase & Sync States
            const [fbReady, setFbReady] = useState(!!window.FirebaseAPI);
            const [currentUser, setCurrentUser] = useState(null);

            // Chat States
            const [showChatModal, setShowChatModal] = useState(false);
            const [visitorId] = useState(() => {
                let id = localStorage.getItem('aura_visitor_id');
                if (!id) {
                    id = 'user_' + Math.random().toString(36).substring(2, 9);
                    localStorage.setItem('aura_visitor_id', id);
                }
                return id;
            });
            const [allChats, setAllChats] = useState([]);
            const [newMessageText, setNewMessageText] = useState('');
            const [selectedAdminThread, setSelectedAdminThread] = useState(null);
            const chatEndRef = useRef(null);

            // Notification / Alert Toast
            const [toast, setToast] = useState(null);

            const showToast = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3000);
            };

            // Listen for Firebase ready event
            useEffect(() => {
                if (window.FirebaseAPI) {
                    setFbReady(true);
                    return;
                }
                const handleReady = () => setFbReady(true);
                window.addEventListener('firebase-ready', handleReady);
                return () => window.removeEventListener('firebase-ready', handleReady);
            }, []);

            // Authenticate with Firebase Auth
            useEffect(() => {
                if (!fbReady) return;
                const { auth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = window.FirebaseAPI;
                
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else if (!auth.currentUser) {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.error('Firebase Auth Error:', err);
                    }
                };

                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (user) => {
                    setCurrentUser(user);
                });

                return () => unsubscribe();
            }, [fbReady]);

            // Sync Influencers & Chats from Firestore
            useEffect(() => {
                if (!fbReady || !currentUser) {
                    // Fallback local storage
                    const savedInf = localStorage.getItem('aura_influencers');
                    if (savedInf) setInfluencers(JSON.parse(savedInf));
                    else setInfluencers(INITIAL_INFLUENCERS);

                    const savedChats = localStorage.getItem('aura_chat_messages');
                    if (savedChats) setAllChats(JSON.parse(savedChats));
                    return;
                }

                const { db, collection, onSnapshot, setDoc, doc } = window.FirebaseAPI;
                const activeAppId = typeof __app_id !== 'undefined' ? __app_id : 'agency-b8e1d';

                // 1. Subscribe to Influencers
                const infColRef = collection(db, 'artifacts', activeAppId, 'public', 'data', 'influencers');
                const unsubscribeInf = onSnapshot(infColRef, (snapshot) => {
                    if (snapshot.empty) {
                        // Seed initial influencers into Firestore if empty
                        INITIAL_INFLUENCERS.forEach(async (inf) => {
                            try {
                                await setDoc(doc(db, 'artifacts', activeAppId, 'public', 'data', 'influencers', inf.id), inf);
                            } catch (e) {
                                console.error('Error seeding influencer:', e);
                            }
                        });
                    } else {
                        const list = snapshot.docs.map(d => d.data());
                        setInfluencers(list);
                        localStorage.setItem('aura_influencers', JSON.stringify(list));
                    }
                }, (error) => {
                    console.error('Firestore Influencers snapshot error:', error);
                });

                // 2. Subscribe to Chats
                const chatsColRef = collection(db, 'artifacts', activeAppId, 'public', 'data', 'chats');
                const unsubscribeChats = onSnapshot(chatsColRef, (snapshot) => {
                    if (snapshot.empty) {
                        const welcomeMsg = {
                            id: 'msg-1',
                            visitorId: visitorId,
                            sender: 'admin',
                            text: 'สวัสดีครับ! ยินดีต้อนรับสู่ AURA Talent หากต้องการสอบถามคิวงาน หรือขอเรทการ์ดเพิ่มเติม ทักแชทไว้ได้เลยครับ',
                            timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                            createdAt: Date.now()
                        };
                        setDoc(doc(db, 'artifacts', activeAppId, 'public', 'data', 'chats', welcomeMsg.id), welcomeMsg);
                    } else {
                        const list = snapshot.docs.map(d => d.data());
                        list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                        setAllChats(list);
                        localStorage.setItem('aura_chat_messages', JSON.stringify(list));
                    }
                }, (error) => {
                    console.error('Firestore Chats snapshot error:', error);
                });

                return () => {
                    unsubscribeInf();
                    unsubscribeChats();
                };
            }, [fbReady, currentUser]);

            // Save Chats & Influencers to localStorage backup
            useEffect(() => {
                if (influencers.length > 0) {
                    localStorage.setItem('aura_influencers', JSON.stringify(influencers));
                }
            }, [influencers]);

            useEffect(() => {
                if (allChats.length > 0) {
                    localStorage.setItem('aura_chat_messages', JSON.stringify(allChats));
                }
            }, [allChats]);

            // Auto scroll chat
            useEffect(() => {
                if (chatEndRef.current) {
                    chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [allChats, showChatModal, selectedAdminThread]);

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPassword === 'admin' || adminPassword === '1234') {
                    setIsAdmin(true);
                    setShowAdminLogin(false);
                    setAdminPassword('');
                    showToast('เข้าสู่ระบบสำหรับ Admin เรียบร้อยแล้ว');
                } else {
                    showToast('รหัสผ่าน Admin ไม่ถูกต้อง (ลองใช้: admin)', 'error');
                }
            };

            const handleLogout = () => {
                setIsAdmin(false);
                showToast('ออกจากระบบ Admin เรียบร้อย');
            };

            const categories = ['All', 'Beauty & Lifestyle', 'Tech & Gadget', 'Food & Travel', 'Fashion', 'Gaming'];

            const filteredInfluencers = influencers.filter(inf => {
                const matchesCat = selectedCategory === 'All' || inf.category === selectedCategory;
                const matchesSearch = inf.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                      inf.handle.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                      inf.bio.toLowerCase().includes(searchTerm.toLowerCase());
                return matchesCat && matchesSearch;
            });

            const handleSaveInfluencer = async (formData) => {
                const targetId = formData.id || ('inf-' + Date.now());
                const updatedData = { ...formData, id: targetId };

                if (fbReady && currentUser) {
                    const { db, doc, setDoc } = window.FirebaseAPI;
                    const activeAppId = typeof __app_id !== 'undefined' ? __app_id : 'agency-b8e1d';
                    try {
                        await setDoc(doc(db, 'artifacts', activeAppId, 'public', 'data', 'influencers', targetId), updatedData);
                    } catch (e) {
                        console.error('Error saving to Firestore:', e);
                    }
                }

                setInfluencers(prev => {
                    const exists = prev.some(i => i.id === targetId);
                    if (exists) return prev.map(i => i.id === targetId ? updatedData : i);
                    return [updatedData, ...prev];
                });

                showToast(formData.id ? 'อัปเดตข้อมูล Influencer สำเร็จ' : 'เพิ่ม Influencer ใหม่เรียบร้อย');
                setShowAddEditModal(false);
                setEditingInfluencer(null);
            };

            const handleDeleteInfluencer = async (id) => {
                if (window.confirm('คุณแน่ใจหรือไม่ว่าต้องการลบ Influencer รายนี้?')) {
                    if (fbReady && currentUser) {
                        const { db, doc, deleteDoc } = window.FirebaseAPI;
                        const activeAppId = typeof __app_id !== 'undefined' ? __app_id : 'agency-b8e1d';
                        try {
                            await deleteDoc(doc(db, 'artifacts', activeAppId, 'public', 'data', 'influencers', id));
                        } catch (e) {
                            console.error('Error deleting from Firestore:', e);
                        }
                    }
                    setInfluencers(prev => prev.filter(item => item.id !== id));
                    setActiveInfluencer(null);
                    showToast('ลบข้อมูลเรียบร้อยแล้ว');
                }
            };

            const handleSendMessage = async (targetVisitorId = visitorId) => {
                if (!newMessageText.trim()) return;

                const newMsg = {
                    id: 'msg-' + Date.now(),
                    visitorId: isAdmin ? targetVisitorId : visitorId,
                    sender: isAdmin ? 'admin' : 'user',
                    text: newMessageText,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    createdAt: Date.now()
                };

                if (fbReady && currentUser) {
                    const { db, doc, setDoc } = window.FirebaseAPI;
                    const activeAppId = typeof __app_id !== 'undefined' ? __app_id : 'agency-b8e1d';
                    try {
                        await setDoc(doc(db, 'artifacts', activeAppId, 'public', 'data', 'chats', newMsg.id), newMsg);
                    } catch (e) {
                        console.error('Error sending message to Firestore:', e);
                    }
                }

                setAllChats(prev => [...prev, newMsg]);
                setNewMessageText('');
            };

            // Get chat threads for Admin
            const chatThreads = Array.from(new Set(allChats.map(m => m.visitorId))).map(vId => {
                const userMsgs = allChats.filter(m => m.visitorId === vId);
                const lastMsg = userMsgs[userMsgs.length - 1];
                return {
                    visitorId: vId,
                    lastMessage: lastMsg ? lastMsg.text : '',
                    timestamp: lastMsg ? lastMsg.timestamp : '',
                    unread: userMsgs.some(m => m.sender === 'user')
                };
            });

            return (
                <div className="min-h-screen flex flex-col relative pb-16">
                    {/* Toast Notification */}
                    {toast && (
                        <div className={`fixed top-5 right-5 z-50 px-5 py-3 rounded-xl shadow-lg text-white font-medium text-sm flex items-center gap-2 transition-all duration-300 ${toast.type === 'error' ? 'bg-rose-500' : 'bg-indigo-600'}`}>
                            <i className={toast.type === 'error' ? 'fa-solid fa-circle-exclamation' : 'fa-solid fa-circle-check'}></i>
                            {toast.msg}
                        </div>
                    )}

                    <header className="sticky top-0 z-30 glass-panel border-b border-slate-200/80">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                            {/* Logo */}
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setSelectedCategory('All')}>
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                                    <i className="fa-solid fa-sparkles text-lg"></i>
                                </div>
                                <div>
                                    <span className="text-xl font-bold tracking-tight text-slate-900 block leading-none">AURA <span className="text-indigo-600">TALENT</span></span>
                                    <span className="text-xs text-slate-500 tracking-wider">INFLUENCER AGENCY</span>
                                </div>
                            </div>

                            {/* Actions & Status */}
                            <div className="flex items-center gap-3">
                                {isAdmin ? (
                                    <div className="flex items-center gap-2">
                                        <span className="px-3 py-1 bg-amber-100 text-amber-800 text-xs font-semibold rounded-full border border-amber-200 flex items-center gap-1.5">
                                            <span className="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                                            Admin Mode
                                        </span>
                                        <button 
                                            onClick={() => { setEditingInfluencer(null); setShowAddEditModal(true); }}
                                            className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium shadow-sm transition-all flex items-center gap-2"
                                        >
                                            <i className="fa-solid fa-plus"></i>
                                            <span className="hidden sm:inline">เพิ่ม Influencer</span>
                                        </button>
                                        <button 
                                            onClick={handleLogout}
                                            className="p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100"
                                            title="ออกจากระบบ"
                                        >
                                            <i className="fa-solid fa-arrow-right-from-bracket text-lg"></i>
                                        </button>
                                    </div>
                                ) : (
                                    <button 
                                        onClick={() => setShowAdminLogin(true)}
                                        className="text-xs text-slate-500 hover:text-indigo-600 px-3 py-2 rounded-lg transition-all flex items-center gap-1.5"
                                    >
                                        <i className="fa-solid fa-lock"></i>
                                        Admin Login
                                    </button>
                                )}

                                {/* Floating Chat Button */}
                                <button 
                                    onClick={() => setShowChatModal(true)}
                                    className="relative px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-sm font-medium shadow-sm transition-all flex items-center gap-2"
                                >
                                    <i className="fa-regular fa-comment-dots text-indigo-400"></i>
                                    <span>{isAdmin ? 'ศูนย์รับแชท' : 'ติดต่อ Admin'}</span>
                                    {isAdmin && chatThreads.length > 0 && (
                                        <span className="absolute -top-1 -right-1 w-5 h-5 bg-rose-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-white">
                                            {chatThreads.length}
                                        </span>
                                    )}
                                </button>
                            </div>
                        </div>
                    </header>

                                    {/* Messages Area */}
                                    <div className="flex-1 flex flex-col bg-slate-50/50">
                                        <div className="flex-1 p-4 overflow-y-auto space-y-3 custom-scrollbar">
                                            {allChats
                                                .filter(m => isAdmin ? (selectedAdminThread ? m.visitorId === selectedAdminThread : true) : m.visitorId === visitorId)
                                                .map(msg => {
                                                    const isMe = isAdmin ? msg.sender === 'admin' : msg.sender === 'user';
                                                    return (
                                                        <div key={msg.id} className={`flex ${isMe ? 'justify-end' : 'justify-start'}`}>
                                                            <div className={`max-w-[80%] rounded-2xl px-4 py-2.5 text-xs shadow-sm ${
                                                                isMe 
                                                                ? 'bg-indigo-600 text-white rounded-br-none' 
                                                                : 'bg-white text-slate-800 border border-slate-200 rounded-bl-none'
                                                            }`}>
                                                                <p className="leading-relaxed whitespace-pre-wrap">{msg.text}</p>
                                                                <span className={`text-[9px] block text-right mt-1 ${isMe ? 'text-indigo-200' : 'text-slate-400'}`}>
                                                                    {msg.timestamp}
                                                                </span>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            <div ref={chatEndRef} />
                                        </div>

                                        {/* Input Bar */}
                                        <div className="p-3 bg-white border-t border-slate-200 flex gap-2">
                                            <input 
                                                type="text" 
                                                placeholder="พิมพ์ข้อความที่นี่..." 
                                                value={newMessageText}
                                                onChange={(e) => setNewMessageText(e.target.value)}
                                                onKeyDown={(e) => e.key === 'Enter' && handleSendMessage(selectedAdminThread || visitorId)}
                                                className="flex-1 px-4 py-2 bg-slate-100 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"
                                            />
                                            <button 
                                                onClick={() => handleSendMessage(selectedAdminThread || visitorId)}
                                                className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold transition-all"
                                            >
                                                <i className="fa-solid fa-paper-plane"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function AdminEditModal({ influencer, categories, onClose, onSave }) {
            const [formData, setFormData] = useState(() => {
                if (influencer) return { gallery: [], ...influencer };
                return {
                    name: '',
                    handle: '',
                    category: categories[0] || 'Beauty & Lifestyle',
                    avatar: '',
                    bio: '',
                    followers: { tiktok: '', instagram: '', youtube: '' },
                    contactEmail: '',
                    contactPhone: '',
                    scopes: [{ id: 's-1', name: 'TikTok Clip (60s)', price: 15000, note: '' }],
                    gallery: [],
                    works: []
                };
            });

            // Scope Handlers
            const handleAddScope = () => {
                setFormData(prev => ({
                    ...prev,
                    scopes: [...prev.scopes, { id: 's-' + Date.now(), name: '', price: 0, note: '' }]
                }));
            };

            const handleRemoveScope = (index) => {
                setFormData(prev => ({
                    ...prev,
                    scopes: prev.scopes.filter((_, i) => i !== index)
                }));
            };

            const handleScopeChange = (index, field, value) => {
                const updated = [...formData.scopes];
                updated[index][field] = value;
                setFormData(prev => ({ ...prev, scopes: updated }));
            };

            // Gallery Image Handlers
            const handleAddGalleryImage = () => {
                setFormData(prev => ({
                    ...prev,
                    gallery: [...(prev.gallery || []), { id: 'g-' + Date.now(), title: '', url: '' }]
                }));
            };

            const handleRemoveGalleryImage = (index) => {
                setFormData(prev => ({
                    ...prev,
                    gallery: prev.gallery.filter((_, i) => i !== index)
                }));
            };

            const handleGalleryChange = (index, field, value) => {
                const updated = [...(formData.gallery || [])];
                updated[index][field] = value;
                setFormData(prev => ({ ...prev, gallery: updated }));
            };

            // Work Clips Handlers
            const handleAddWork = () => {
                setFormData(prev => ({
                    ...prev,
                    works: [...prev.works, { id: 'w-' + Date.now(), title: '', type: 'youtube', url: '' }]
                }));
            };

            const handleRemoveWork = (index) => {
                setFormData(prev => ({
                    ...prev,
                    works: prev.works.filter((_, i) => i !== index)
                }));
            };

            const handleWorkChange = (index, field, value) => {
                const updated = [...formData.works];
                updated[index][field] = value;
                setFormData(prev => ({ ...prev, works: updated }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave(formData);
            };

            return (
                <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                    <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl my-auto">
                        <div className="p-5 border-b border-slate-200 flex items-center justify-between">
                            <h3 className="font-bold text-slate-800 text-base">
                                {influencer ? 'แก้ไขข้อมูล Influencer' : 'เพิ่ม Influencer ใหม่เข้าสังกัด'}
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600">
                                <i className="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="p-6 overflow-y-auto custom-scrollbar space-y-5 text-xs">
                            {/* General Profile */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block font-medium text-slate-700 mb-1">ชื่อ - นามสกุล / ชื่อในวงการ</label>
                                    <input 
                                        type="text" required 
                                        value={formData.name} 
                                        onChange={e => setFormData({...formData, name: e.target.value})}
                                        className="w-full px-3 py-2 border border-slate-200 rounded-xl" 
                                    />
                                </div>
                                <div>
                                    <label className="block font-medium text-slate-700 mb-1">Handle / Username (@)</label>
                                    <input 
                                        type="text" required 
                                        value={formData.handle} 
                                        onChange={e => setFormData({...formData, handle: e.target.value})}
                                        className="w-full px-3 py-2 border border-slate-200 rounded-xl" 
                                    />
                                </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block font-medium text-slate-700 mb-1">หมวดหมู่คอนเทนต์</label>
                                    <select 
                                        value={formData.category} 
                                        onChange={e => setFormData({...formData, category: e.target.value})}
                                        className="w-full px-3 py-2 border border-slate-200 rounded-xl bg-white"
                                    >
                                        {categories.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block font-medium text-slate-700 mb-1">ลิงก์รูปโปรไฟล์ (URL Image)</label>
                                    <input 
                                        type="text" 
                                        value={formData.avatar} 
                                        onChange={e => setFormData({...formData, avatar: e.target.value})}
                                        placeholder="https://..."
                                        className="w-full px-3 py-2 border border-slate-200 rounded-xl" 
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="block font-medium text-slate-700 mb-1">คำอธิบายประวัติสั้นๆ (Bio)</label>
                                <textarea 
                                    rows="2"
                                    value={formData.bio} 
                                    onChange={e => setFormData({...formData, bio: e.target.value})}
                                    className="w-full px-3 py-2 border border-slate-200 rounded-xl"
                                ></textarea>
                            </div>

                            {/* Followers */}
                            <div className="p-3 bg-slate-50 rounded-2xl border border-slate-200/80">
                                <span className="font-bold text-slate-700 block mb-2">จำนวนผู้ติดตาม (Followers)</span>
                                <div className="grid grid-cols-3 gap-3">
                                    <input 
                                        placeholder="TikTok (เช่น 1.2M)"
                                        value={formData.followers?.tiktok || ''}
                                        onChange={e => setFormData({...formData, followers: {...formData.followers, tiktok: e.target.value}})}
                                        className="px-3 py-1.5 border border-slate-200 rounded-xl bg-white"
                                    />
                                    <input 
                                        placeholder="Instagram (เช่น 450K)"
                                        value={formData.followers?.instagram || ''}
                                        onChange={e => setFormData({...formData, followers: {...formData.followers, instagram: e.target.value}})}
                                        className="px-3 py-1.5 border border-slate-200 rounded-xl bg-white"
                                    />
                                    <input 
                                        placeholder="YouTube (เช่น 280K)"
                                        value={formData.followers?.youtube || ''}
                                        onChange={e => setFormData({...formData, followers: {...formData.followers, youtube: e.target.value}})}
                                        className="px-3 py-1.5 border border-slate-200 rounded-xl bg-white"
                                    />
                                </div>
                            </div>

                            {/* Scope & Price Dynamic Form */}
                            <div>
                                <div className="flex items-center justify-between mb-2">
                                    <span className="font-bold text-slate-700">ขอบเขตงาน & เรทราคา (Scope of Work)</span>
                                    <button 
                                        type="button" 
                                        onClick={handleAddScope}
                                        className="text-indigo-600 font-semibold hover:underline"
                                    >
                                        + เพิ่มประเภทงาน
                                    </button>
                                </div>
                                <div className="space-y-2">
                                    {formData.scopes.map((scope, index) => (
                                        <div key={scope.id || index} className="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200">
                                            <input 
                                                placeholder="ชื่อ Scope งาน (เช่น 1 TikTok Video)"
                                                value={scope.name}
                                                onChange={e => handleScopeChange(index, 'name', e.target.value)}
                                                className="flex-1 px-2.5 py-1.5 border border-slate-200 rounded-lg bg-white"
                                            />
                                            <input 
                                                type="number"
                                                placeholder="ราคา (บาท)"
                                                value={scope.price}
                                                onChange={e => handleScopeChange(index, 'price', Number(e.target.value))}
                                                className="w-28 px-2.5 py-1.5 border border-slate-200 rounded-lg bg-white"
                                            />
                                            <button 
                                                type="button" 
                                                onClick={() => handleRemoveScope(index)}
                                                className="text-rose-500 p-1 hover:text-rose-700"
                                            >
                                                <i className="fa-solid fa-trash"></i>
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Gallery & Rate Card Images Management Section */}
                            <div>
                                <div className="flex items-center justify-between mb-2">
                                    <span className="font-bold text-slate-700">รูปภาพรายละเอียด / เรทการ์ด (Gallery Images)</span>
                                    <button 
                                        type="button" 
                                        onClick={handleAddGalleryImage}
                                        className="text-indigo-600 font-semibold hover:underline"
                                    >
                                        + เพิ่มรูปภาพเรทการ์ด
                                    </button>
                                </div>
                                <div className="space-y-2">
                                    {formData.gallery && formData.gallery.length > 0 ? (
                                        formData.gallery.map((item, index) => (
                                            <div key={item.id || index} className="flex items-start gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                                                {/* Image Thumbnail Preview */}
                                                <div className="w-12 h-12 bg-slate-200 rounded-lg overflow-hidden flex-shrink-0 border border-slate-300">
                                                    {item.url ? (
                                                        <img src={item.url} className="w-full h-full object-cover" onError={(e) => { e.target.src = 'https://placehold.co/100?text=Error'; }} />
                                                    ) : (
                                                        <div className="w-full h-full flex items-center justify-center text-slate-400 text-xs">
                                                            <i className="fa-regular fa-image"></i>
                                                        </div>
                                                    )}
                                                </div>
                                                <div className="flex-1 space-y-1.5">
                                                    <input 
                                                        placeholder="หัวข้อรูปภาพ (เช่น เรทการ์ดแพ็กเกจ A / TikTok Insight)"
                                                        value={item.title}
                                                        onChange={e => handleGalleryChange(index, 'title', e.target.value)}
                                                        className="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg bg-white"
                                                    />
                                                    <input 
                                                        placeholder="ลิงก์ URL รูปภาพ (https://...)"
                                                        value={item.url}
                                                        onChange={e => handleGalleryChange(index, 'url', e.target.value)}
                                                        className="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg bg-white"
                                                    />
                                                </div>
                                                <button 
                                                    type="button" 
                                                    onClick={() => handleRemoveGalleryImage(index)}
                                                    className="text-rose-500 p-1 hover:text-rose-700 mt-1"
                                                    title="ลบรูปภาพนี้"
                                                >
                                                    <i className="fa-solid fa-trash"></i>
                                                </button>
                                            </div>
                                        ))
                                    ) : (
                                        <p className="text-[11px] text-slate-400 italic">ยังไม่มีรูปภาพเรทการ์ด กดปุ่ม "+ เพิ่มรูปภาพเรทการ์ด" ด้านบนเพื่อเพิ่ม</p>
                                    )}
                                </div>
                            </div>

                            {/* Works Video Clips Embed */}
                            <div>
                                <div className="flex items-center justify-between mb-2">
                                    <span className="font-bold text-slate-700">คลิปผลงานตัวอย่าง (YouTube / Embed)</span>
                                    <button 
                                        type="button" 
                                        onClick={handleAddWork}
                                        className="text-indigo-600 font-semibold hover:underline"
                                    >
                                        + แปะลิงก์คลิป
                                    </button>
                                </div>
                                <div className="space-y-2">
                                    {formData.works.map((work, index) => (
                                        <div key={work.id || index} className="flex items-center gap-2 bg-slate-50 p-2 rounded-xl border border-slate-200">
                                            <input 
                                                placeholder="หัวข้อคลิป"
                                                value={work.title}
                                                onChange={e => handleWorkChange(index, 'title', e.target.value)}
                                                className="w-1/3 px-2.5 py-1.5 border border-slate-200 rounded-lg bg-white"
                                            />
                                            <input 
                                                placeholder="Embed URL (เช่น https://www.youtube.com/embed/...)"
                                                value={work.url}
                                                onChange={e => handleWorkChange(index, 'url', e.target.value)}
                                                className="flex-1 px-2.5 py-1.5 border border-slate-200 rounded-lg bg-white"
                                            />
                                            <button 
                                                type="button" 
                                                onClick={() => handleRemoveWork(index)}
                                                className="text-rose-500 p-1 hover:text-rose-700"
                                            >
                                                <i className="fa-solid fa-trash"></i>
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="pt-4 border-t border-slate-200 flex justify-end gap-2">
                                <button 
                                    type="button" 
                                    onClick={onClose}
                                    className="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl font-semibold"
                                >
                                    ยกเลิก
                                </button>
                                <button 
                                    type="submit" 
                                    className="px-5 py-2 bg-indigo-600 text-white rounded-xl font-semibold shadow-sm"
                                >
                                    บันทึกข้อมูล
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
