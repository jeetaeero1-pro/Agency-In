<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Haung Ting Ming - Influencer Portfolio Management</title>

    <!-- Google Fonts & Tailwind CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '"Prompt"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#1e1b4b',
                        }
                    }
                }
            }
        }
    </script>

    <!-- React 18 & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase 11 SDK Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config)
            : {
                apiKey: "AIzaSyCEqqlQ5v7muBfcrePVjc6e0wcS7Ihr3YI",
                authDomain: "agency-b8e1d.firebaseapp.com",
                projectId: "agency-b8e1d",
                storageBucket: "agency-b8e1d.firebasestorage.app",
                messagingSenderId: "1085196717304",
                appId: "1:1085196717304:web:91c88184bd5ae64b9fbf0d",
                measurementId: "G-0J928RY0HN"
            };

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            window.FirebaseAPI = {
                auth,
                db,
                signInAnonymously,
                signInWithCustomToken,
                onAuthStateChanged,
                doc,
                getDoc,
                setDoc,
                updateDoc,
                deleteDoc,
                onSnapshot,
                collection
            };
        } catch (e) {
            console.warn("Firebase Init Failed, falling back to offline mode", e);
        }
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
        body { font-family: 'Plus Jakarta Sans', 'Prompt', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(229, 231, 235, 0.8);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        @media (max-width: 640px) {
            .mobile-modal-full {
                height: 100%;
                max-height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const formatImageUrl = (url) => {
            if (!url) return '';
            let cleaned = url.trim();
            if (cleaned.includes('drive.google.com')) {
                const match = cleaned.match(/\/d\/([a-zA-Z0-9_-]+)/) || cleaned.match(/id=([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    return `https://lh3.googleusercontent.com/d/${match[1]}`;
                }
            }
            if (cleaned.includes('dropbox.com')) {
                return cleaned.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('?dl=0', '');
            }
            return cleaned;
        };

        const { useState, useEffect, useRef } = React;
        const INITIAL_INFLUENCERS = [];

        function App() {
            const [influencers, setInfluencers] = useState([]);
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [searchTerm, setSearchTerm] = useState('');
            const [activeInfluencer, setActiveInfluencer] = useState(null);
            const [viewImage, setViewImage] = useState(null);

            const [isAdmin, setIsAdmin] = useState(false);
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [adminLoginError, setAdminLoginError] = useState('');
            const [showAddEditModal, setShowAddEditModal] = useState(false);
            const [editingInfluencer, setEditingInfluencer] = useState(null);

            const [fbReady, setFbReady] = useState(!!window.FirebaseAPI);
            const [currentUser, setCurrentUser] = useState(null);
            const [fbStatus, setFbStatus] = useState({ connected: false, error: null });

            const [showChatModal, setShowChatModal] = useState(false);
            const [visitorId] = useState(() => {
                let id = localStorage.getItem('Haung Ting Ming_visitor_id');
                if (!id) {
                    id = 'user_' + Math.random().toString(36).substring(2, 9);
                    localStorage.setItem('Haung Ting Ming_visitor_id', id);
                }
                return id;
            });
            const [allChats, setAllChats] = useState([]);
            const [newMessageText, setNewMessageText] = useState('');
            const [selectedAdminThread, setSelectedAdminThread] = useState(null);
            const chatEndRef = useRef(null);

            const [toast, setToast] = useState(null);

            const showToast = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3000);
            };

            useEffect(() => {
                if (window.FirebaseAPI) {
                    setFbReady(true);
                    return;
                }
                const handleReady = () => setFbReady(true);
                window.addEventListener('firebase-ready', handleReady);
                return () => window.removeEventListener('firebase-ready', handleReady);
            }, []);

            useEffect(() => {
                if (!fbReady || !window.FirebaseAPI) return;
                const { auth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = window.FirebaseAPI;
                
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else if (!auth.currentUser) {
                            await signInAnonymously(auth);
                        }
                        setFbStatus({ connected: true, error: null });
                    } catch (err) {
                        console.error('Firebase Auth Error:', err);
                        setFbStatus({ connected: false, error: err.message });
                    }
                };

                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (user) => {
                    setCurrentUser(user);
                    if (user) setFbStatus({ connected: true, error: null });
                });

                return () => unsubscribe();
            }, [fbReady]);

            useEffect(() => {
                if (!fbReady || !window.FirebaseAPI) {
                    const savedInf = localStorage.getItem('Haung Ting Ming_influencers');
                    if (savedInf) setInfluencers(JSON.parse(savedInf));
                    const savedChats = localStorage.getItem('Haung Ting Ming_chat_messages');
                    if (savedChats) setAllChats(JSON.parse(savedChats));
                    return;
                }

                const { db, collection, onSnapshot } = window.FirebaseAPI;
                const activeAppId = typeof __app_id !== 'undefined' ? __app_id : 'agency-b8e1d';

                const infColRef = collection(db, 'artifacts', activeAppId, 'public', 'data', 'influencers');
                const unsubscribeInf = onSnapshot(infColRef, (snapshot) => {
                    const list = snapshot.docs.map(d => d.data());
                    setInfluencers(list);
                    localStorage.setItem('Haung Ting Ming_influencers', JSON.stringify(list));
                }, (error) => {
                    const savedInf = localStorage.getItem('Haung Ting Ming_influencers');
                    if (savedInf) setInfluencers(JSON.parse(savedInf));
                });

                const chatsColRef = collection(db, 'artifacts', activeAppId, 'public', 'data', 'chats');
                const unsubscribeChats = onSnapshot(chatsColRef, (snapshot) => {
                    const rawList = snapshot.docs.map(d => d.data());
                    const uniqueMap = new Map();
                    rawList.forEach(item => { if (item.id) uniqueMap.set(item.id, item); });
                    const list = Array.from(uniqueMap.values());
                    list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                    setAllChats(list);
                    localStorage.setItem('Haung Ting Ming_chat_messages', JSON.stringify(list));
                }, (error) => {
                    const savedChats = localStorage.getItem('Haung Ting Ming_chat_messages');
                    if (savedChats) setAllChats(JSON.parse(savedChats));
                });

                return () => {
                    unsubscribeInf();
                    unsubscribeChats();
                };
            }, [fbReady]);

            useEffect(() => {
                if (chatEndRef.current) {
                    chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [allChats, showChatModal]);

            const handleLogoDoubleClick = () => {
                if (!isAdmin) {
                    setAdminLoginError('');
                    setAdminPassword('');
                    setShowAdminLogin(true);
                }
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                setAdminLoginError('');
                
                // แก้ไขการเช็กรหัสผ่าน Admin ให้ถูกต้อง
                if (adminPassword === 'Pack' || adminPassword === 'admin123') {
                    setIsAdmin(true);
                    setShowAdminLogin(false);
                    setAdminPassword('');
                    showToast('เข้าสู่ระบบ Admin เรียบร้อย');
                } else {
                    setAdminLoginError('รหัสผ่านไม่ถูกต้อง');
                }
            };

            const handleLogout = () => {
                setIsAdmin(false);
                showToast('ออกจากระบบ Admin เรียบร้อย');
            };

            const categories = ['All', 'Beauty & Lifestyle', 'Tech & Gadget', 'Food & Travel', 'Fashion', 'Gaming'];

            const filteredInfluencers = influencers.filter(inf => {
                const matchesCat = selectedCategory === 'All' || inf.category === selectedCategory;
                const matchesSearch = (inf.name || '').toLowerCase().includes(searchTerm.toLowerCase()) || 
                                      (inf.handle || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                                      (inf.bio || '').toLowerCase().includes(searchTerm.toLowerCase());
                return matchesCat && matchesSearch;
            });

            const handleSaveInfluencer = async (formData) => {
                const targetId = formData.id || ('inf-' + Date.now());
                const updatedData = { 
                    ...formData, 
                    id: targetId,
                    avatar: formatImageUrl(formData.avatar),
                    gallery: (formData.gallery || []).map(g => ({ ...g, url: formatImageUrl(g.url) }))
                };

                if (fbReady && window.FirebaseAPI) {
                    const { db, doc, setDoc } = window.FirebaseAPI;
                    const activeAppId = typeof __app_id !== 'undefined' ? __app_id : 'agency-b8e1d';
                    try {
                        await setDoc(doc(db, 'artifacts', activeAppId, 'public', 'data', 'influencers', targetId), updatedData);
                    } catch (e) {
                        console.error('Firestore Save Error:', e);
                    }
                }

                setInfluencers(prev => {
                    const exists = prev.some(i => i.id === targetId);
                    if (exists) return prev.map(i => i.id === targetId ? updatedData : i);
                    return [updatedData, ...prev];
                });

                showToast(formData.id ? 'อัปเดตข้อมูลสำเร็จ' : 'เพิ่มข้อมูลสำเร็จ');
                setShowAddEditModal(false);
                setEditingInfluencer(null);
            };

            const handleDeleteInfluencer = async (id) => {
                if (window.confirm('คุณแน่ใจหรือไม่ว่าต้องการลบข้อมูลนี้?')) {
                    if (fbReady && window.FirebaseAPI) {
                        const { db, doc, deleteDoc } = window.FirebaseAPI;
                        const activeAppId = typeof __app_id !== 'undefined' ? __app_id : 'agency-b8e1d';
                        try {
                            await deleteDoc(doc(db, 'artifacts', activeAppId, 'public', 'data', 'influencers', id));
                        } catch (e) {
                            console.error('Firestore Delete Error:', e);
                        }
                    }
                    setInfluencers(prev => prev.filter(item => item.id !== id));
                    setActiveInfluencer(null);
                    showToast('ลบข้อมูลเรียบร้อยแล้ว');
                }
            };

            const handleSendMessage = async (targetVisitorId = visitorId) => {
                if (!newMessageText.trim()) return;

                const messageId = 'msg-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6);
                const newMsg = {
                    id: messageId,
                    visitorId: isAdmin ? targetVisitorId : visitorId,
                    sender: isAdmin ? 'admin' : 'user',
                    text: newMessageText.trim(),
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    createdAt: Date.now()
                };

                setNewMessageText('');

                if (fbReady && window.FirebaseAPI) {
                    const { db, doc, setDoc } = window.FirebaseAPI;
                    const activeAppId = typeof __app_id !== 'undefined' ? __app_id : 'agency-b8e1d';
                    try {
                        await setDoc(doc(db, 'artifacts', activeAppId, 'public', 'data', 'chats', newMsg.id), newMsg);
                        return;
                    } catch (e) {
                        console.error('Firestore Chat Error:', e);
                    }
                }

                setAllChats(prev => [...prev, newMsg]);
            };

            const chatThreads = Array.from(new Set(allChats.map(m => m.visitorId))).map(vId => {
                const userMsgs = allChats.filter(m => m.visitorId === vId);
                const lastMsg = userMsgs[userMsgs.length - 1];
                return {
                    visitorId: vId,
                    lastMessage: lastMsg ? lastMsg.text : '',
                    timestamp: lastMsg ? lastMsg.timestamp : '',
                    unread: userMsgs.some(m => m.sender === 'user')
                };
            });

            const currentChats = allChats.filter(m => isAdmin ? (selectedAdminThread ? m.visitorId === selectedAdminThread : true) : m.visitorId === visitorId);

            return (
                <div className="min-h-screen flex flex-col relative pb-12">
                    {toast && (
                        <div className={`fixed top-4 right-5 z-50 px-4 py-3 rounded-xl shadow-xl text-white font-medium text-xs sm:text-sm flex items-center gap-2 ${toast.type === 'error' ? 'bg-rose-500' : 'bg-indigo-600'}`}>
                            <i className={toast.type === 'error' ? 'fa-solid fa-circle-exclamation' : 'fa-solid fa-circle-check'}></i>
                            <span>{toast.msg}</span>
                        </div>
                    )}

                    <header className="sticky top-0 z-30 glass-panel border-b border-slate-200/80">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 sm:py-4 flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-0">
                            <div 
                                className="flex items-center gap-2.5 cursor-pointer select-none group w-full sm:w-auto justify-between sm:justify-start" 
                                onDoubleClick={handleLogoDoubleClick}
                                onClick={() => setSelectedCategory('All')}
                            >
                                <div className="flex items-center gap-2.5">
                                    <div className="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                                        <i className="fa-solid fa-sparkles text-sm sm:text-base"></i>
                                    </div>
                                    <div>
                                        <span className="text-base sm:text-lg font-bold tracking-tight text-slate-900 block leading-none">
                                            Haung Ting Ming <span className="text-indigo-600">TALENT</span>
                                        </span>
                                        <span className="text-[10px] sm:text-xs text-slate-500 tracking-wider">INFLUENCER AGENCY</span>
                                    </div>
                                </div>
                            </div>

                            <div className="flex items-center gap-2.5 w-full sm:w-auto justify-end">
                                {isAdmin && (
                                    <div className="flex items-center gap-2">
                                        <span className="px-2.5 py-1 bg-amber-100 text-amber-800 text-xs font-semibold rounded-full border border-amber-200">Admin Mode</span>
                                        <button 
                                            onClick={() => { setEditingInfluencer(null); setShowAddEditModal(true); }}
                                            className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs sm:text-sm font-medium"
                                        >
                                            + เพิ่ม Influencer
                                        </button>
                                        <button onClick={handleLogout} className="p-1.5 text-slate-400 hover:text-slate-600">
                                            <i className="fa-solid fa-arrow-right-from-bracket"></i>
                                        </button>
                                    </div>
                                )}
                                <button 
                                    onClick={() => setShowChatModal(true)}
                                    className="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-sm font-medium flex items-center gap-2"
                                >
                                    <i className="fa-regular fa-comment-dots text-indigo-400"></i>
                                    <span>{isAdmin ? 'ข้อความทั้งหมด' : 'ติดต่อ Admin'}</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10 flex-1 w-full">
                        <div className="text-center max-w-2xl mx-auto mb-6 sm:mb-10">
                            <h1 className="text-2xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
                                Influencer Management Portfolio
                            </h1>
                            <p className="text-slate-500 text-xs sm:text-base mt-2">
                                ระบบจัดการเรทการ์ดและผลงานอินฟลูเอนเซอร์
                            </p>
                        </div>

                        <div className="mb-6 sm:mb-8 flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-2 overflow-x-auto w-full md:w-auto custom-scrollbar">
                                {categories.map(cat => (
                                    <button
                                        key={cat}
                                        onClick={() => setSelectedCategory(cat)}
                                        className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-medium whitespace-nowrap ${
                                            selectedCategory === cat 
                                            ? 'bg-indigo-600 text-white' 
                                            : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'
                                        }`}
                                    >
                                        {cat === 'All' ? 'ทั้งหมด' : cat}
                                    </button>
                                ))}
                            </div>

                            <input
                                type="text"
                                placeholder="ค้นหาอินฟลูเอนเซอร์..."
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                className="w-full md:w-72 px-4 py-2 bg-white border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                            />
                        </div>

                        {filteredInfluencers.length === 0 ? (
                            <div className="text-center py-12 bg-white rounded-2xl border border-slate-200">
                                <p className="text-slate-500 text-sm">ยังไม่มีข้อมูล Influencer ในระบบ</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                {filteredInfluencers.map(inf => (
                                    <div key={inf.id} className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition-shadow">
                                        <div className="relative h-48 bg-slate-800">
                                            <img 
                                                src={formatImageUrl(inf.avatar)} 
                                                alt={inf.name}
                                                className="w-full h-full object-cover"
                                                onError={(e) => { e.target.src = 'https://placehold.co/600x400?text=No+Image'; }}
                                            />
                                            {isAdmin && (
                                                <div className="absolute top-2 right-2 flex gap-1 bg-slate-900/80 p-1 rounded-lg">
                                                    <button onClick={() => { setEditingInfluencer(inf); setShowAddEditModal(true); }} className="text-white px-2 py-1 text-xs">แก้ไข</button>
                                                    <button onClick={() => handleDeleteInfluencer(inf.id)} className="text-rose-400 px-2 py-1 text-xs">ลบ</button>
                                                </div>
                                            )}
                                        </div>
                                        <div className="p-4">
                                            <h3 className="font-bold text-lg text-slate-900">{inf.name}</h3>
                                            <p className="text-xs text-slate-500">{inf.handle}</p>
                                            <p className="text-xs text-slate-600 mt-2 line-clamp-2">{inf.bio}</p>
                                            <button 
                                                onClick={() => setActiveInfluencer(inf)}
                                                className="mt-4 w-full py-2 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 rounded-xl text-xs font-semibold"
                                            >
                                                ดูข้อมูลเรทการ์ด
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Admin Login Modal */}
                    {showAdminLogin && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl">
                                <h3 className="text-lg font-bold text-slate-900 mb-4">เข้าสู่ระบบ Admin</h3>
                                {adminLoginError && <p className="text-rose-500 text-xs mb-2">{adminLoginError}</p>}
                                <form onSubmit={handleAdminLogin} className="space-y-4">
                                    <input 
                                        type="password"
                                        placeholder="รหัสผ่าน Admin (เช่น Pack)"
                                        value={adminPassword}
                                        onChange={(e) => setAdminPassword(e.target.value)}
                                        className="w-full px-3 py-2 border rounded-xl text-sm"
                                        autoFocus
                                    />
                                    <div className="flex gap-2">
                                        <button type="button" onClick={() => setShowAdminLogin(false)} className="flex-1 py-2 bg-slate-100 text-xs font-semibold rounded-xl">ยกเลิก</button>
                                        <button type="submit" className="flex-1 py-2 bg-indigo-600 text-white text-xs font-semibold rounded-xl">ตกลง</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Chat Modal */}
                    {showChatModal && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full h-[500px] flex flex-col overflow-hidden">
                                <div className="p-4 bg-slate-900 text-white flex justify-between items-center">
                                    <h3 className="font-bold text-sm">แชทติดต่อ Admin</h3>
                                    <button onClick={() => setShowChatModal(false)}><i className="fa-solid fa-xmark"></i></button>
                                </div>
                                <div className="flex-1 p-4 overflow-y-auto space-y-2">
                                    {currentChats.map(msg => (
                                        <div key={msg.id} className={`flex ${msg.sender === (isAdmin ? 'admin' : 'user') ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`p-2.5 rounded-xl text-xs max-w-[80%] ${msg.sender === (isAdmin ? 'admin' : 'user') ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-800'}`}>
                                                {msg.text}
                                            </div>
                                        </div>
                                    ))}
                                    <div ref={chatEndRef} />
                                </div>
                                <div className="p-3 border-t flex gap-2">
                                    <input 
                                        type="text" 
                                        placeholder="พิมพ์ข้อความ..." 
                                        value={newMessageText} 
                                        onChange={e => setNewMessageText(e.target.value)}
                                        onKeyDown={e => e.key === 'Enter' && handleSendMessage()}
                                        className="flex-1 px-3 py-1.5 border rounded-xl text-xs"
                                    />
                                    <button onClick={() => handleSendMessage()} className="px-3 py-1.5 bg-indigo-600 text-white rounded-xl text-xs">ส่ง</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
