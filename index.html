<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Haung Ting Ming - Influencer Portfolio Management</title>

    <!-- Google Fonts & Tailwind CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '"Prompt"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#1e1b4b',
                        }
                    }
                }
            }
        }
    </script>

    <!-- React 18 & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase 11 SDK Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config)
            : {
                apiKey: "AIzaSyCEqqlQ5v7muBfcrePVjc6e0wcS7Ihr3YI",
                authDomain: "agency-b8e1d.firebaseapp.com",
                projectId: "agency-b8e1d",
                storageBucket: "agency-b8e1d.firebasestorage.app",
                messagingSenderId: "1085196717304",
                appId: "1:1085196717304:web:91c88184bd5ae64b9fbf0d",
                measurementId: "G-0J928RY0HN"
            };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.FirebaseAPI = {
            auth,
            db,
            signInAnonymously,
            signInWithCustomToken,
            onAuthStateChanged,
            doc,
            getDoc,
            setDoc,
            updateDoc,
            deleteDoc,
            onSnapshot,
            collection
        };
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <style>
        body { font-family: 'Plus Jakarta Sans', 'Prompt', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(229, 231, 235, 0.8);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        @media (max-width: 640px) {
            .mobile-modal-full {
                height: 100%;
                max-height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [viewImage, setViewImage] = useState(null);

            const [isAdmin, setIsAdmin] = useState(false);
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [adminLoginError, setAdminLoginError] = useState('');

            const [fbReady, setFbReady] = useState(!!window.FirebaseAPI);
            const [currentUser, setCurrentUser] = useState(null);

            // Chat States
            const [showChatModal, setShowChatModal] = useState(false);
            const [visitorId] = useState(() => {
                let id = localStorage.getItem('HaungTingMing_visitor_id');
                if (!id) {
                    id = 'user_' + Math.random().toString(36).substring(2, 9);
                    localStorage.setItem('HaungTingMing_visitor_id', id);
                }
                return id;
            });
            const [allChats, setAllChats] = useState([]);
            const [newMessageText, setNewMessageText] = useState('');
            const [selectedAdminThread, setSelectedAdminThread] = useState(null);
            const [chatImagePreview, setChatImagePreview] = useState(null);
            const fileInputRef = useRef(null);
            const chatEndRef = useRef(null);

            const [toast, setToast] = useState(null);
            const showToast = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3000);
            };

            useEffect(() => {
                if (window.FirebaseAPI) {
                    setFbReady(true);
                    return;
                }
                const handleReady = () => setFbReady(true);
                window.addEventListener('firebase-ready', handleReady);
                return () => window.removeEventListener('firebase-ready', handleReady);
            }, []);

            useEffect(() => {
                if (!fbReady) return;
                const { auth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = window.FirebaseAPI;
                
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else if (!auth.currentUser) {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.error('Firebase Auth Error:', err);
                    }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (user) => {
                    setCurrentUser(user);
                });

                return () => unsubscribe();
            }, [fbReady]);

            // Sync Firebase Chats (Realtime)
            useEffect(() => {
                if (!fbReady) {
                    const savedChats = localStorage.getItem('HaungTingMing_chat_messages');
                    if (savedChats) setAllChats(JSON.parse(savedChats));
                    return;
                }

                const { db, collection, onSnapshot, setDoc, doc } = window.FirebaseAPI;
                const activeAppId = typeof __app_id !== 'undefined' ? __app_id : 'agency-b8e1d';

                const chatsColRef = collection(db, 'artifacts', activeAppId, 'public', 'data', 'chats');
                const unsubscribeChats = onSnapshot(chatsColRef, (snapshot) => {
                    if (snapshot.empty) {
                        const welcomeMsg = {
                            id: 'msg-welcome',
                            visitorId: visitorId,
                            sender: 'admin',
                            text: 'สวัสดีครับ! ยินดีต้อนรับสู่ Haung Ting Ming สามารถสอบถามรายละเอียด หรือส่งไฟล์รูปอ้างอิงทิ้งไว้ได้เลยครับ',
                            imageUrl: '',
                            isRead: true,
                            timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                            createdAt: Date.now()
                        };
                        setDoc(doc(db, 'artifacts', activeAppId, 'public', 'data', 'chats', welcomeMsg.id), welcomeMsg);
                    } else {
                        const rawList = snapshot.docs.map(d => d.data());
                        const uniqueMap = new Map();
                        rawList.forEach(item => {
                            if (item.id) uniqueMap.set(item.id, item);
                        });
                        const list = Array.from(uniqueMap.values());
                        list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                        
                        setAllChats(list);
                        localStorage.setItem('HaungTingMing_chat_messages', JSON.stringify(list));
                    }
                });

                return () => unsubscribeChats();
            }, [fbReady]);

            // อัปเดตสถานะ "อ่านแล้ว" เมื่อเปิดหน้าต่างแชท
            useEffect(() => {
                if (!showChatModal || !fbReady) return;

                const { db, doc, updateDoc } = window.FirebaseAPI;
                const activeAppId = typeof __app_id !== 'undefined' ? __app_id : 'agency-b8e1d';
                const activeThread = isAdmin ? selectedAdminThread : visitorId;

                if (!activeThread) return;

                const unreadMsgs = allChats.filter(m => 
                    m.visitorId === activeThread && 
                    !m.isRead && 
                    (isAdmin ? m.sender === 'user' : m.sender === 'admin')
                );

                unreadMsgs.forEach(async (m) => {
                    try {
                        const msgRef = doc(db, 'artifacts', activeAppId, 'public', 'data', 'chats', m.id);
                        await updateDoc(msgRef, { isRead: true });
                    } catch (e) {
                        console.error('Error updating read status:', e);
                    }
                });
            }, [showChatModal, selectedAdminThread, allChats, isAdmin, fbReady]);

            // เลื่อนลงล่างสุดอัตโนมัติเมื่อมีข้อความใหม่
            useEffect(() => {
                if (chatEndRef.current) {
                    chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [allChats, showChatModal, selectedAdminThread]);

            const handleImageSelect = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    showToast('กรุณาเลือกไฟล์รูปภาพเท่านั้น', 'error');
                    return;
                }
                if (file.size > 3 * 1024 * 1024) {
                    showToast('ขนาดไฟล์ต้องไม่เกิน 3MB', 'error');
                    return;
                }
                const reader = new FileReader();
                reader.onloadend = () => setChatImagePreview(reader.result);
                reader.readAsDataURL(file);
            };

            const handleSendMessage = async (targetVisitorId = visitorId) => {
                if (!newMessageText.trim() && !chatImagePreview) return;

                const messageId = 'msg-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6);

                const newMsg = {
                    id: messageId,
                    visitorId: isAdmin ? targetVisitorId : visitorId,
                    sender: isAdmin ? 'admin' : 'user',
                    text: newMessageText.trim(),
                    imageUrl: chatImagePreview || '',
                    isRead: false,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    createdAt: Date.now()
                };

                setNewMessageText('');
                setChatImagePreview(null);
                if (fileInputRef.current) fileInputRef.current.value = '';

                if (fbReady) {
                    const { db, doc, setDoc } = window.FirebaseAPI;
                    const activeAppId = typeof __app_id !== 'undefined' ? __app_id : 'agency-b8e1d';
                    try {
                        await setDoc(doc(db, 'artifacts', activeAppId, 'public', 'data', 'chats', newMsg.id), newMsg);
                        return;
                    } catch (e) {
                        console.error('Error sending message:', e);
                    }
                }

                setAllChats(prev => [...prev, newMsg]);
            };

            const handleLogoDoubleClick = () => {
                if (!isAdmin) {
                    setAdminLoginError('');
                    setAdminPassword('');
                    setShowAdminLogin(true);
                }
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPassword === 'Pack') {
                    setIsAdmin(true);
                    setShowAdminLogin(false);
                    setAdminPassword('');
                    showToast('เข้าสู่ระบบสำหรับ Admin เรียบร้อยแล้ว');
                } else {
                    setAdminLoginError('รหัสผ่านไม่ถูกต้อง');
                }
            };

            // ประมวลผลรายการผู้สนทนาสำหรับฝั่ง Admin
            const chatThreads = Array.from(new Set(allChats.map(m => m.visitorId))).map(vId => {
                const userMsgs = allChats.filter(m => m.visitorId === vId);
                const lastMsg = userMsgs[userMsgs.length - 1];
                const unreadCount = userMsgs.filter(m => !m.isRead && m.sender === 'user').length;
                return {
                    visitorId: vId,
                    lastMessage: lastMsg ? (lastMsg.imageUrl ? '📷 [รูปภาพ]' : lastMsg.text) : '',
                    timestamp: lastMsg ? lastMsg.timestamp : '',
                    unreadCount
                };
            });

            // กรองข้อความแสดงผลในห้องแชทปัจจุบัน
            const currentChats = Array.from(
                new Map(
                    allChats
                        .filter(m => isAdmin ? (selectedAdminThread ? m.visitorId === selectedAdminThread : true) : m.visitorId === visitorId)
                        .map(m => [m.id, m])
                ).values()
            );

            const totalUnreadAdmin = allChats.filter(m => !m.isRead && m.sender === 'user').length;
            const userUnreadCount = allChats.filter(m => m.visitorId === visitorId && !m.isRead && m.sender === 'admin').length;

            return (
                <div className="min-h-screen flex flex-col relative pb-12">
                    {/* Toast Alert */}
                    {toast && (
                        <div className={`fixed top-4 right-4 z-50 px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold flex items-center gap-2 text-white ${toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`}>
                            <i className={`fa-solid ${toast.type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'}`}></i>
                            {toast.msg}
                        </div>
                    )}

                    {/* Header */}
                    <header className="sticky top-0 z-30 glass-panel border-b border-slate-200/80">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
                            <div className="flex items-center gap-2.5 cursor-pointer select-none" onDoubleClick={handleLogoDoubleClick}>
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold">HTM</div>
                                <div>
                                    <span className="text-lg font-bold text-slate-900 block leading-none">Haung Ting Ming <span className="text-indigo-600">TALENT</span></span>
                                    <span className="text-xs text-slate-500">INFLUENCER AGENCY</span>
                                </div>
                            </div>
                            <button 
                                onClick={() => setShowChatModal(true)}
                                className="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-sm font-medium flex items-center gap-2 relative transition-all"
                            >
                                <i className="fa-regular fa-comment-dots text-indigo-400"></i>
                                <span>{isAdmin ? 'ศูนย์รับแชท' : 'ติดต่อ Admin'}</span>
                                {isAdmin && totalUnreadAdmin > 0 && (
                                    <span className="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold animate-pulse">
                                        {totalUnreadAdmin}
                                    </span>
                                )}
                                {!isAdmin && userUnreadCount > 0 && (
                                    <span className="absolute -top-1 -right-1 bg-indigo-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold animate-bounce">
                                        {userUnreadCount}
                                    </span>
                                )}
                            </button>
                        </div>
                    </header>

                    {/* Main Section */}
                    <main className="max-w-7xl mx-auto px-4 py-12 flex-1 w-full flex flex-col items-center justify-center text-center">
                        <div className="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-2xl mb-4">
                            <i className="fa-solid fa-comments"></i>
                        </div>
                        <h1 className="text-3xl font-extrabold text-slate-900">Web App Internal Chat System</h1>
                        <p className="text-slate-500 text-sm mt-2 max-w-md">ระบบแชทโต้ตอบระหว่างลูกค้าและ Admin แบบ Realtime พร้อมแจ้งสถานะการอ่านและส่งไฟล์รูปภาพได้ทันที</p>
                    </main>

                    {/* Admin Login Modal */}
                    {showAdminLogin && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl">
                                <h3 className="text-lg font-bold text-slate-900 mb-2">เข้าสู่ระบบ Admin</h3>
                                <form onSubmit={handleAdminLogin} className="space-y-4">
                                    <input 
                                        type="password" 
                                        placeholder="ใส่รหัสผ่าน..." 
                                        value={adminPassword} 
                                        onChange={(e) => setAdminPassword(e.target.value)}
                                        className="w-full px-3.5 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500/20 outline-none"
                                        autoFocus
                                    />
                                    {adminLoginError && <p className="text-xs text-rose-500">{adminLoginError}</p>}
                                    <div className="flex justify-end gap-2">
                                        <button type="button" onClick={() => setShowAdminLogin(false)} className="px-4 py-2 text-xs font-semibold text-slate-500 hover:text-slate-700">ยกเลิก</button>
                                        <button type="submit" className="px-4 py-2 text-xs font-semibold bg-indigo-600 text-white rounded-xl">เข้าสู่ระบบ</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Fullscreen Image Preview Modal */}
                    {viewImage && (
                        <div className="fixed inset-0 z-50 bg-slate-950/90 flex items-center justify-center p-4" onClick={() => setViewImage(null)}>
                            <div className="relative max-w-4xl w-full max-h-[90vh] flex flex-col items-center">
                                <img src={viewImage.url} alt={viewImage.title} className="max-w-full max-h-[80vh] object-contain rounded-xl" />
                                <p className="text-white text-xs mt-3">{viewImage.title}</p>
                                <button className="absolute -top-10 right-0 text-white text-xl hover:opacity-75"><i className="fa-solid fa-xmark"></i></button>
                            </div>
                        </div>
                    )}

                    {/* Chat Modal */}
                    {showChatModal && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-0 sm:p-4">
                            <div className="bg-white mobile-modal-full sm:rounded-3xl max-w-2xl w-full h-[100vh] sm:h-[600px] flex flex-col shadow-2xl overflow-hidden">
                                {/* Chat Header */}
                                <div className="p-4 bg-slate-900 text-white flex items-center justify-between flex-shrink-0">
                                    <div className="flex items-center gap-3">
                                        <div className="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center text-white">
                                            <i className="fa-regular fa-comments"></i>
                                        </div>
                                        <div>
                                            <h3 className="font-bold text-sm">{isAdmin ? 'ศูนย์จัดการแชทจากลูกค้า' : 'แชทติดต่อ Admin'}</h3>
                                            <p className="text-[10px] text-slate-400">ระบบแสดงสถานะการอ่านแบบ Realtime</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setShowChatModal(false)} className="text-slate-400 hover:text-white transition-colors">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                {/* Chat Body */}
                                <div className="flex-1 flex overflow-hidden">
                                    {/* Sidebar Admin Chat Threads */}
                                    {isAdmin && (
                                        <div className="w-1/3 border-r border-slate-200 bg-slate-50 overflow-y-auto custom-scrollbar">
                                            {chatThreads.length === 0 ? (
                                                <div className="p-4 text-center text-xs text-slate-400">ยังไม่มีรายการแชท</div>
                                            ) : (
                                                chatThreads.map(thread => (
                                                    <div 
                                                        key={thread.visitorId}
                                                        onClick={() => setSelectedAdminThread(thread.visitorId)}
                                                        className={`p-3 border-b text-xs cursor-pointer relative transition-colors ${selectedAdminThread === thread.visitorId ? 'bg-white font-bold border-l-4 border-l-indigo-600' : 'hover:bg-slate-100'}`}
                                                    >
                                                        <div className="truncate text-slate-800">{thread.visitorId}</div>
                                                        <div className="text-[10px] text-slate-400 truncate">{thread.lastMessage || 'เริ่มการสนทนา'}</div>
                                                        {thread.unreadCount > 0 && (
                                                            <span className="absolute top-3 right-3 bg-rose-500 text-white text-[9px] px-1.5 py-0.5 rounded-full font-bold">
                                                                {thread.unreadCount}
                                                            </span>
                                                        )}
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    )}

                                    {/* Messages View */}
                                    <div className="flex-1 flex flex-col bg-slate-50/50">
                                        <div className="flex-1 p-4 overflow-y-auto space-y-3 custom-scrollbar">
                                            {currentChats.length === 0 ? (
                                                <div className="h-full flex items-center justify-center text-xs text-slate-400">
                                                    ยังไม่มีข้อความสนทนา
                                                </div>
                                            ) : (
                                                currentChats.map(msg => {
                                                    const isMe = isAdmin ? msg.sender === 'admin' : msg.sender === 'user';
                                                    return (
                                                        <div key={msg.id} className={`flex ${isMe ? 'justify-end' : 'justify-start'}`}>
                                                            <div className={`max-w-[80%] rounded-2xl p-3 text-xs shadow-sm ${isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-white text-slate-800 border border-slate-200 rounded-bl-none'}`}>
                                                                {msg.imageUrl && (
                                                                    <img 
                                                                        src={msg.imageUrl} 
                                                                        alt="Chat Attachment" 
                                                                        onClick={() => setViewImage({ url: msg.imageUrl, title: 'รูปภาพจากแชท' })}
                                                                        className="max-w-full max-h-48 object-cover rounded-xl mb-2 cursor-pointer border border-white/20 hover:opacity-90 transition-opacity"
                                                                    />
                                                                )}
                                                                {msg.text && <p className="leading-relaxed whitespace-pre-wrap break-words">{msg.text}</p>}
                                                                
                                                                <div className="flex items-center justify-end gap-1 mt-1">
                                                                    <span className={`text-[9px] font-mono ${isMe ? 'text-indigo-200' : 'text-slate-400'}`}>{msg.timestamp}</span>
                                                                    {isMe && (
                                                                        <span className="text-[9px] font-medium ml-1">
                                                                            {msg.isRead ? (
                                                                                <span className="text-emerald-300 font-bold flex items-center gap-0.5">
                                                                                    <i className="fa-solid fa-check-double text-[8px]"></i> อ่านแล้ว
                                                                                </span>
                                                                            ) : (
                                                                                <span className="text-indigo-200">ส่งแล้ว</span>
                                                                            )}
                                                                        </span>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })
                                            )}
                                            <div ref={chatEndRef} />
                                        </div>

                                        {/* Image Preview Container */}
                                        {chatImagePreview && (
                                            <div className="px-4 py-2 bg-slate-100 border-t border-slate-200 flex items-center justify-between">
                                                <div className="flex items-center gap-2">
                                                    <img src={chatImagePreview} alt="Preview" className="w-10 h-10 object-cover rounded-lg border" />
                                                    <span className="text-xs text-slate-600 font-medium">พร้อมส่งไฟล์รูปภาพนี้</span>
                                                </div>
                                                <button onClick={() => setChatImagePreview(null)} className="text-rose-500 hover:text-rose-700 text-xs font-bold px-2 py-1">
                                                    ยกเลิก
                                                </button>
                                            </div>
                                        )}

                                        {/* Controls Input */}
                                        <div className="p-3 bg-white border-t border-slate-200 flex items-center gap-2">
                                            <input 
                                                type="file" 
                                                ref={fileInputRef}
                                                accept="image/*" 
                                                onChange={handleImageSelect} 
                                                className="hidden" 
                                            />
                                            <button 
                                                type="button"
                                                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                                className="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition-colors flex-shrink-0"
                                                title="แนบรูปภาพ"
                                            >
                                                <i className="fa-solid fa-paperclip text-sm"></i>
                                            </button>

                                            <input 
                                                type="text" 
                                                placeholder="พิมพ์ข้อความ..." 
                                                value={newMessageText}
                                                onChange={(e) => setNewMessageText(e.target.value)}
                                                onKeyDown={(e) => e.key === 'Enter' && handleSendMessage(selectedAdminThread || visitorId)}
                                                className="flex-1 px-3.5 py-2 bg-slate-100 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                                            />
                                            <button 
                                                onClick={() => handleSendMessage(selectedAdminThread || visitorId)}
                                                className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-colors"
                                            >
                                                <span>ส่ง</span>
                                                <i className="fa-solid fa-paper-plane text-[10px]"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
