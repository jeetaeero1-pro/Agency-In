                    { title: 'TikTok Tech Unboxing (60s)', price: '20,000', detail: 'สรุปจุดเด่นใน 1 นาที ปักลิงก์ซื้อ' }
                ],

                    { url: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=800&q=80', caption: 'ยอดวิวเฉลี่ยต่อคลิปไอที 250,000+ วิว' }

        // Helper to convert YouTube / TikTok links into embeddable URLs
        const formatEmbedUrl = (url) => {
            if (!url) return '';
            let cleanUrl = url.trim();
            if (cleanUrl.includes('youtube.com/watch?v=')) {
                const videoId = cleanUrl.split('v=')[1]?.split('&')[0];
                return `https://www.youtube.com/embed/${videoId}`;
            }
            if (cleanUrl.includes('youtu.be/')) {
                const videoId = cleanUrl.split('youtu.be/')[1]?.split('?')[0];
                return `https://www.youtube.com/embed/${videoId}`;
            }
            if (cleanUrl.includes('youtube.com/shorts/')) {
                const videoId = cleanUrl.split('shorts/')[1]?.split('?')[0];
                return `https://www.youtube.com/embed/${videoId}`;
            }
            return cleanUrl;
        };

        function App() {
            // State
            const [influencers, setInfluencers] = useState(() => {
                const saved = localStorage.getItem('aura_influencers');
                return saved ? JSON.parse(saved) : DEFAULT_INFLUENCERS;
            });
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [adminPassInput, setAdminPassInput] = useState('');
            const [loginError, setLoginError] = useState('');

            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('All');

            const [activeInfluencer, setActiveInfluencer] = useState(null);
            const [editingInfluencer, setEditingInfluencer] = useState(null);
            const [previewImageModal, setPreviewImageModal] = useState(null);

            // Chat state
            const [showChatModal, setShowChatModal] = useState(false);
            const [chatMessages, setChatMessages] = useState(() => {
                const saved = localStorage.getItem('aura_chat_messages');
                return saved ? JSON.parse(saved) : [
                    { id: 1, sender: 'admin', text: 'สวัสดีครับ สนใจเช็กคิวงาน Influencer คนไหนแจ้งแบรนด์และรายละเอียดงานได้เลยนะครับ', time: '10:00' }

            // Save state to LocalStorage
            useEffect(() => {
                localStorage.setItem('aura_influencers', JSON.stringify(influencers));
            }, [influencers]);

            useEffect(() => {
                localStorage.setItem('aura_chat_messages', JSON.stringify(chatMessages));
            }, [chatMessages]);

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPassInput === 'admin') {
                    setIsAdmin(true);
                    setShowLoginModal(false);
                    setAdminPassInput('');
                    setLoginError('');
                } else {
                    setLoginError('รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง');
                }
            };

            // Form Handlers for Influencer CRUD
            const handleSaveInfluencer = (influencerData) => {
                if (influencerData.id) {
                    setInfluencers(influencers.map(i => i.id === influencerData.id ? influencerData : i));
                } else {
                    const newInf = { ...influencerData, id: 'inf-' + Date.now() };
                    setInfluencers([...influencers, newInf]);
                }
                setEditingInfluencer(null);
            };

            const handleDeleteInfluencer = (id) => {
                if (window.confirm('คุณต้องการลบข้อมูล Influencer รายนี้ใช่หรือไม่?')) {
                    setInfluencers(influencers.filter(i => i.id !== id));
                    if (activeInfluencer && activeInfluencer.id === id) setActiveInfluencer(null);
                }
            };

            // Send Chat Message
            const handleSendMessage = (e) => {
                e.preventDefault();
                if (!inputMessage.trim()) return;
                const newMsg = {
                    id: Date.now(),
                    sender: isAdmin ? 'admin' : 'user',
                    text: inputMessage,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                setChatMessages([...chatMessages, newMsg]);
                setInputMessage('');
            };

            // Filter Categories
            const categories = ['All', 'Beauty & Lifestyle', 'Tech & Gaming', 'Fashion', 'Food & Travel'];

            const filteredInfluencers = influencers.filter(inf => {
                const matchSearch = inf.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                    inf.handle.toLowerCase().includes(searchQuery.toLowerCase());
                const matchCat = selectedCategory === 'All' || inf.category === selectedCategory;
                return matchSearch && matchCat;
            });

            return (
                <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800">

                    {/* INFLUENCER RATE CARD & DETAILS MODAL */}

                                        <div>

                                            <a href={activeInfluencer.socialLinks.tiktok} target="_blank" rel="noreferrer" className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl text-xs font-medium flex items-center gap-1.5 transition-colors">
                                                <i className="fa-brands fa-tiktok text-black"></i> TikTok Profile

                                        {activeInfluencer.socialLinks?.ig && (
                                            <a href={activeInfluencer.socialLinks.ig} target="_blank" rel="noreferrer" className="px-3 py-1.5 bg-pink-50 hover:bg-pink-100 text-pink-700 rounded-xl text-xs font-medium flex items-center gap-1.5 transition-colors">

                                        {activeInfluencer.socialLinks?.youtube && (

                                                        {scope.detail && <p className="text-[11px] text-slate-500 mt-0.5">{scope.detail}</p>}
                                                    </div>
                                                    <div className="text-right whitespace-nowrap">
                                                        <span className="text-sm font-extrabold text-indigo-600">฿{scope.price}</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Gallery & RateCard Images */}
                                    {activeInfluencer.gallery?.length > 0 && (
                                        <div>
                                            <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">ภาพรายละเอียด / เรทการ์ดเพิ่มเติม</h4>
                                            <div className="grid grid-cols-2 gap-3">
                                                {activeInfluencer.gallery.map((img, idx) => (
                                                    <div key={idx} className="group relative rounded-2xl overflow-hidden border border-slate-200 cursor-pointer" onClick={() => setPreviewImageModal(img.url)}>
                                                        <img src={img.url} className="w-full h-32 object-cover group-hover:scale-105 transition-transform duration-300" />
                                                        {img.caption && (
                                                            <div className="absolute inset-x-0 bottom-0 p-2 bg-gradient-to-t from-black/80 to-transparent text-[10px] text-white truncate">
                                                                {img.caption}
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* Video Clips Player / Embed Section */}
                                    {activeInfluencer.videoUrl && (
                                        <div>
                                            <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">ตัวอย่างผลงานที่ผ่านมา (CLIPS / VIDEOS)</h4>
                                            <div className="bg-slate-900 rounded-2xl overflow-hidden shadow-inner">
                                                <div className="p-2.5 bg-slate-800 text-xs font-medium text-white flex items-center justify-between">
                                                    <span><i className="fa-brands fa-youtube mr-1.5 text-red-500"></i>{activeInfluencer.videoTitle || 'คลิปวิดีโอตัวอย่างผลงาน'}</span>
                                                    <a href={activeInfluencer.videoUrl} target="_blank" rel="noreferrer" className="text-[10px] text-indigo-300 hover:underline">
                                                        เปิดในเบราว์เซอร์ <i className="fa-solid fa-arrow-up-right-from-square text-[9px] ml-0.5"></i>
                                                    </a>
                                                </div>
                                                <div className="relative aspect-video w-full bg-black">
                                                    <iframe 
                                                        src={formatEmbedUrl(activeInfluencer.videoUrl)} 
                                                        className="w-full h-full border-0"
                                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                                        allowFullScreen
                                                    ></iframe>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* Direct Contact Info Box - Crucial Contact Email & Phone */}
                                    <div className="p-4 bg-indigo-50 border border-indigo-100 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-3">
                                        <div className="text-center sm:text-left">
                                            <span className="text-[10px] font-bold tracking-wider text-indigo-600 uppercase">สนใจดิลงานกับคนนี้?</span>
                                            <div className="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-3 text-xs text-indigo-900 font-medium mt-0.5">
                                                {activeInfluencer.contactEmail && (
                                                    <span><i className="fa-regular fa-envelope mr-1 text-indigo-500"></i>{activeInfluencer.contactEmail}</span>
                                                )}
                                                {activeInfluencer.contactPhone && (
                                                    <span><i className="fa-solid fa-phone mr-1 text-indigo-500"></i>{activeInfluencer.contactPhone}</span>
                                                )}
                                                {!activeInfluencer.contactEmail && !activeInfluencer.contactPhone && (
                                                    <span>ติดต่อผ่าน Admin ทางแชท</span>
                                                )}
                                            </div>
                                        </div>
                                        <button 
                                            onClick={() => { setActiveInfluencer(null); setShowChatModal(true); }}
                                            className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold shadow-sm transition-all whitespace-nowrap"
                                        >
                                            <i className="fa-regular fa-paper-plane mr-1"></i>
                                            ทักแชทสอบถามคิว
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ADMIN INFLUENCER EDIT / ADD MODAL */}
                    {editingInfluencer && (
                        <AdminEditModal 
                            influencer={editingInfluencer} 
                            onSave={handleSaveInfluencer} 
                            onClose={() => setEditingInfluencer(null)} 
                        />
                    )}

                    {/* ADMIN LOGIN MODAL */}
                    {showLoginModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl relative">
                                <button 
                                    onClick={() => { setShowLoginModal(false); setLoginError(''); }}
                                    className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"
                                >
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                                <div className="text-center mb-6">
                                    <div className="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-2 text-xl font-bold">
                                        <i className="fa-solid fa-lock"></i>
                                    </div>
                                    <h3 className="font-bold text-slate-900 text-lg">Admin Login</h3>
                                    <p className="text-xs text-slate-400 mt-0.5">กรอกรหัสผ่านเพื่อจัดการข้อมูลในระบบ</p>
                                </div>

                                {loginError && (
                                    <div className="p-3 mb-4 bg-rose-50 border border-rose-200 text-rose-600 rounded-xl text-xs flex items-center gap-2">
                                        <i className="fa-solid fa-circle-exclamation text-sm"></i>
                                        <span>{loginError}</span>
                                    </div>
                                )}

                                <form onSubmit={handleAdminLogin} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-700 mb-1">Password</label>
                                        <input 
                                            type="password" 
                                            placeholder="กรอกรหัสผ่าน (ทดสอบใช้: admin)"
                                            value={adminPassInput}
                                            onChange={e => setAdminPassInput(e.target.value)}
                                            className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-indigo-500"
                                            autoFocus
                                        />
                                    </div>
                                    <button 
                                        type="submit"
                                        className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold shadow-sm transition-colors"
                                    >
                                        เข้าสู่ระบบ
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* PRIVATE INQUIRY CHAT MODAL */}
                    {showChatModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-slate-900/50 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden flex flex-col h-[520px]">
                                <div className="p-4 bg-slate-900 text-white flex items-center justify-between">
                                    <div className="flex items-center gap-2.5">
                                        <div className="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center text-xs font-bold">
                                            A
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-xs">แชทติดต่อ Agency Admin</h4>
                                            <span className="text-[10px] text-emerald-400 flex items-center gap-1">
                                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                                                Online
                                            </span>
                                        </div>
                                    </div>
                                    <button onClick={() => setShowChatModal(false)} className="text-slate-400 hover:text-white">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div className="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50">
                                    {chatMessages.map(msg => (
                                        <div 
                                            key={msg.id} 
                                            className={`flex flex-col ${msg.sender === (isAdmin ? 'admin' : 'user') ? 'items-end' : 'items-start'}`}
                                        >
                                            <div className={`max-w-[80%] p-3 rounded-2xl text-xs leading-relaxed ${
                                                msg.sender === (isAdmin ? 'admin' : 'user')
                                                    ? 'bg-indigo-600 text-white rounded-br-none'
                                                    : 'bg-white text-slate-800 border border-slate-200 rounded-bl-none shadow-sm'
                                            }`}>
                                                {msg.text}
                                            </div>
                                            <span className="text-[9px] text-slate-400 mt-1 px-1">{msg.time}</span>
                                        </div>
                                    ))}
                                </div>

                                <form onSubmit={handleSendMessage} className="p-3 bg-white border-t border-slate-200 flex items-center gap-2">
                                    <input 
                                        type="text" 
                                        placeholder="พิมพ์ข้อความสอบถามคิวงาน..."
                                        value={inputMessage}
                                        onChange={e => setInputMessage(e.target.value)}
                                        className="flex-1 px-3.5 py-2 bg-slate-100 rounded-xl text-xs focus:outline-none focus:bg-white focus:border focus:border-indigo-500 transition-all"
                                    />
                                    <button type="submit" className="w-9 h-9 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl flex items-center justify-center text-xs transition-colors">
                                        <i className="fa-regular fa-paper-plane"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* LIGHTBOX IMAGE PREVIEW MODAL */}
                    {previewImageModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md" onClick={() => setPreviewImageModal(null)}>
                            <div className="relative max-w-4xl w-full max-h-[90vh]">
                                <img src={previewImageModal} className="w-full h-full object-contain rounded-2xl" />
                                <button className="absolute -top-10 right-0 text-white text-xl">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        </div>
                    )}

                    <!-- Footer -->
                    <footer className="bg-white border-t border-slate-200 py-6 px-4 text-center text-xs text-slate-400">
                        <p>© 2026 AURA TALENT AGENCY. All rights reserved.</p>
                    </footer>
                </div>
            );
        }

        function AdminEditModal({ influencer, onSave, onClose }) {
            const [formData, setFormData] = useState({ ...influencer });

            const handleScopeChange = (index, field, value) => {
                const newScopes = [...formData.scopes];
                newScopes[index][field] = value;
                setFormData({ ...formData, scopes: newScopes });
            };

            const addScope = () => {
                setFormData({
                    ...formData,
                    scopes: [...formData.scopes, { title: '', price: '', detail: '' }]
                });
            };

            const removeScope = (index) => {
                setFormData({
                    ...formData,
                    scopes: formData.scopes.filter((_, idx) => idx !== index)
                });
            };

            const handleGalleryChange = (index, field, value) => {
                const newGallery = [...formData.gallery];
                newGallery[index][field] = value;
                setFormData({ ...formData, gallery: newGallery });
            };

            const addGalleryImage = () => {
                setFormData({
                    ...formData,
                    gallery: [...(formData.gallery || []), { url: '', caption: '' }]
                });
            };

            const removeGalleryImage = (index) => {
                setFormData({
                    ...formData,
                    gallery: formData.gallery.filter((_, idx) => idx !== index)
                });
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-slate-900/60 backdrop-blur-sm overflow-y-auto">
                    <div className="bg-white w-full max-w-3xl rounded-3xl shadow-2xl overflow-hidden my-auto max-h-[90vh] flex flex-col">
                        <div className="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
                            <h3 className="font-bold text-sm">
                                {influencer.id ? 'แก้ไขข้อมูล Influencer' : 'เพิ่ม Influencer ใหม่'}
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-white">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <div className="p-6 overflow-y-auto space-y-5 text-xs">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block font-medium text-slate-700 mb-1">ชื่อ - นามสกุล / ชื่อในวงการ</label>
                                    <input 
                                        type="text" 
                                        value={formData.name} 
                                        onChange={e => setFormData({...formData, name: e.target.value})}
                                        className="w-full px-3 py-2 border border-slate-200 rounded-xl" 
                                    />
                                </div>
                                <div>
                                    <label className="block font-medium text-slate-700 mb-1">Handle / Username (@)</label>
                                    <input 
                                        type="text" 
                                        value={formData.handle} 
                                        onChange={e => setFormData({...formData, handle: e.target.value})}
                                        className="w-full px-3 py-2 border border-slate-200 rounded-xl" 
                                    />
                                </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block font-medium text-slate-700 mb-1">หมวดหมู่คอนเทนต์</label>
                                    <select 
                                        value={formData.category} 
                                        onChange={e => setFormData({...formData, category: e.target.value})}
                                        className="w-full px-3 py-2 border border-slate-200 rounded-xl bg-white"
                                    >
                                        <option value="Beauty & Lifestyle">Beauty & Lifestyle</option>
                                        <option value="Tech & Gaming">Tech & Gaming</option>
                                        <option value="Fashion">Fashion</option>
                                        <option value="Food & Travel">Food & Travel</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block font-medium text-slate-700 mb-1">ลิงก์รูปโปรไฟล์ (URL Image)</label>
                                    <input 
                                        type="text" 
                                        value={formData.avatar} 
                                        onChange={e => setFormData({...formData, avatar: e.target.value})}
                                        className="w-full px-3 py-2 border border-slate-200 rounded-xl" 
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="block font-medium text-slate-700 mb-1">คำอธิบายประวัติสั้นๆ (Bio)</label>
                                <textarea 
                                    rows="2"
                                    value={formData.bio} 
                                    onChange={e => setFormData({...formData, bio: e.target.value})}
                                    className="w-full px-3 py-2 border border-slate-200 rounded-xl"
                                ></textarea>
                            </div>

                            {/* Contact Info (Email & Phone) */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block font-medium text-slate-700 mb-1">อีเมลติดต่อ (Contact Email)</label>
                                    <input 
                                        type="email"
                                        placeholder="contact@example.com"
                                        value={formData.contactEmail || ''} 
                                        onChange={e => setFormData({...formData, contactEmail: e.target.value})}
                                        className="w-full px-3 py-2 border border-slate-200 rounded-xl" 
                                    />
                                </div>
                                <div>
                                    <label className="block font-medium text-slate-700 mb-1">เบอร์โทรศัพท์ติดต่อ (Contact Phone)</label>
                                    <input 
                                        type="text" 
                                        placeholder="08x-xxx-xxxx"
                                        value={formData.contactPhone || ''} 
                                        onChange={e => setFormData({...formData, contactPhone: e.target.value})}
                                        className="w-full px-3 py-2 border border-slate-200 rounded-xl" 
                                    />
                                </div>
                            </div>

                            {/* Social Profile Links Section */}
                            <div className="p-3 bg-indigo-50/60 rounded-2xl border border-indigo-100">
                                <label className="block font-bold text-indigo-900 mb-2">ลิงก์โปรไฟล์โซเชียลมีเดีย</label>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    <input 
                                        type="text" 
                                        placeholder="TikTok URL" 
                                        value={formData.socialLinks?.tiktok || ''}
                                        onChange={e => setFormData({...formData, socialLinks: {...formData.socialLinks, tiktok: e.target.value}})}
                                        className="px-3 py-1.5 border border-slate-200 rounded-xl bg-white"
                                    />
                                    <input 
                                        type="text" 
                                        placeholder="Instagram URL" 
                                        value={formData.socialLinks?.ig || ''}
                                        onChange={e => setFormData({...formData, socialLinks: {...formData.socialLinks, ig: e.target.value}})}
                                        className="px-3 py-1.5 border border-slate-200 rounded-xl bg-white"
                                    />
                                    <input 
                                        type="text" 
                                        placeholder="YouTube URL" 
                                        value={formData.socialLinks?.youtube || ''}
                                        onChange={e => setFormData({...formData, socialLinks: {...formData.socialLinks, youtube: e.target.value}})}
                                        className="px-3 py-1.5 border border-slate-200 rounded-xl bg-white"
                                    />
                                </div>
                            </div>

                            {/* Followers Counts */}
                            <div>
                                <label className="block font-medium text-slate-700 mb-1">จำนวนผู้ติดตาม (Followers)</label>
                                <div className="grid grid-cols-3 gap-3">
                                    <input 
                                        type="text" placeholder="TikTok (e.g. 1.2M)"
                                        value={formData.followers?.tiktok || ''} 
                                        onChange={e => setFormData({...formData, followers: {...formData.followers, tiktok: e.target.value}})}
                                        className="px-3 py-2 border border-slate-200 rounded-xl"
                                    />
                                    <input 
                                        type="text" placeholder="IG (e.g. 450K)"
                                        value={formData.followers?.ig || ''} 
                                        onChange={e => setFormData({...formData, followers: {...formData.followers, ig: e.target.value}})}
                                        className="px-3 py-2 border border-slate-200 rounded-xl"
                                    />
                                    <input 
                                        type="text" placeholder="YouTube (e.g. 280K)"
                                        value={formData.followers?.youtube || ''} 
                                        onChange={e => setFormData({...formData, followers: {...formData.followers, youtube: e.target.value}})}
                                        className="px-3 py-2 border border-slate-200 rounded-xl"
                                    />
                                </div>
                            </div>

                            {/* Scopes & Pricing List Manager */}
                            <div>
                                <div className="flex items-center justify-between mb-2">
                                    <label className="font-bold text-slate-800">ขอบเขตงาน & เรทราคา (Scope of Work)</label>
                                    <button onClick={addScope} className="text-indigo-600 font-semibold text-xs hover:underline">+ เพิ่มประเภทงาน</button>
                                </div>
                                <div className="space-y-2">
                                    {formData.scopes?.map((sc, idx) => (
                                        <div key={idx} className="flex items-center gap-2">
                                            <input 
                                                type="text" placeholder="ชื่องาน (เช่น TikTok Clip 60s)"
                                                value={sc.title} onChange={e => handleScopeChange(idx, 'title', e.target.value)}
                                                className="flex-1 px-3 py-1.5 border border-slate-200 rounded-xl"
                                            />
                                            <input 
                                                type="text" placeholder="ราคา (บาท)"
                                                value={sc.price} onChange={e => handleScopeChange(idx, 'price', e.target.value)}
                                                className="w-28 px-3 py-1.5 border border-slate-200 rounded-xl"
                                            />
                                            <button onClick={() => removeScope(idx)} className="text-rose-500 p-1.5">
                                                <i className="fa-solid fa-trash"></i>
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Gallery & Rate Card Image Manager */}
                            <div>
                                <div className="flex items-center justify-between mb-2">
                                    <label className="font-bold text-slate-800">รูปภาพรายละเอียด / เรทการ์ด (Gallery Images)</label>
                                    <button onClick={addGalleryImage} className="text-indigo-600 font-semibold text-xs hover:underline">+ เพิ่มรูปภาพเรทการ์ด</button>
                                </div>
                                <div className="space-y-2">
                                    {formData.gallery?.map((img, idx) => (
                                        <div key={idx} className="flex items-center gap-2">
                                            <input 
                                                type="text" placeholder="URL รูปภาพ"
                                                value={img.url} onChange={e => handleGalleryChange(idx, 'url', e.target.value)}
                                                className="flex-1 px-3 py-1.5 border border-slate-200 rounded-xl"
                                            />
                                            <input 
                                                type="text" placeholder="คำอธิบายรูปภาพ"
                                                value={img.caption} onChange={e => handleGalleryChange(idx, 'caption', e.target.value)}
                                                className="w-40 px-3 py-1.5 border border-slate-200 rounded-xl"
                                            />
                                            <button onClick={() => removeGalleryImage(idx)} className="text-rose-500 p-1.5">
                                                <i className="fa-solid fa-trash"></i>
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Video Link */}
                            <div>
                                <label className="block font-medium text-slate-700 mb-1">ลิงก์วิดีโอตัวอย่างผลงาน (YouTube Video URL)</label>
                                <input 
                                    type="text" 
                                    placeholder="https://www.youtube.com/watch?v=..."
                                    value={formData.videoUrl} 
                                    onChange={e => setFormData({...formData, videoUrl: e.target.value})}
                                    className="w-full px-3 py-2 border border-slate-200 rounded-xl mb-2" 
                                />
                                <input 
                                    type="text" 
                                    placeholder="หัวข้อวิดีโอ (เช่น รีวิวสกินแคร์กู้ผิว)"
                                    value={formData.videoTitle} 
                                    onChange={e => setFormData({...formData, videoTitle: e.target.value})}
                                    className="w-full px-3 py-2 border border-slate-200 rounded-xl" 
                                />
                            </div>
                        </div>

                        <div className="p-4 bg-slate-50 border-t border-slate-200 flex justify-end gap-2">
                            <button onClick={onClose} className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl font-medium">
                                ยกเลิก
                            </button>
                            <button onClick={() => onSave(formData)} className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold shadow-sm">
                                บันทึกข้อมูล
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Render App
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
